# Auto-labels PRs by which files they touch, using rules in
# `.github/labeler.yml`. Saves maintainers a manual triage step on
# every PR and gives the PR list a glance-readable shape (`docs +
# vt + tests` at a glance reads as "VT conformance + doc update").
#
# Triggered on:
#   - pull_request_target (with `permissions.pull-requests: write`)
#     so the action can apply labels. The bare `pull_request` event
#     runs in a forked PR's context with no write perms — labels
#     would silently no-op. `pull_request_target` runs in the base
#     repo's context with the maintainer's token; safe here because
#     we only read the file list, never check out the fork's code.

name: PR Auto-label

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

# Cancel superseded labeler runs on the same PR. Keying
# by `pull_request.number` instead of `github.ref` (the branch-ref
# concurrency idiom used in ci.yml and friends) because
# `pull_request_target` exposes `github.ref` as the base branch
# (refs/heads/main) — same-ref keying would cross-cancel labeler
# runs across ALL open PRs, which is wrong (each PR needs its own
# latest-only run). PR-number keying gives each PR its own
# concurrency group; a synchronize-event burst on one PR cancels its
# own earlier runs but doesn't touch other PRs.
concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    name: Apply labels by changed paths
    runs-on: ubuntu-latest
    # Budget cap. Vendored JS action, ~10 s real time;
    # 5 min handles a GitHub API rate-limit retry.
    timeout-minutes: 5
    steps:
      # The `actions/labeler` action vendors all the logic itself —
      # no setup-node / etc. needed. The immutable SHA below is the
      # reviewed v6.2.0 release; Dependabot keeps the pin current.
      - uses: actions/labeler@b8dd2d9be0f68b860e7dae5dae7d772984eacd6d # v6.2.0
        with:
          configuration-path: .github/labeler.yml
          # Don't sync-labels — keep manually-applied labels (e.g.,
          # `triage` or `good-first-issue` set by a maintainer) on
          # the PR even after the auto-labeler runs. The action's
          # default is to remove non-matching labels; `sync-labels:
          # false` flips that to additive-only.
          sync-labels: false
