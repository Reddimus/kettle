# Auto-labels PRs by which files they touch, using rules in
# `.github/labeler.yml`. Saves maintainers a manual triage step on
# every PR and gives the PR list a glance-readable shape (`docs +
# vt + tests` at a glance reads as "VT conformance + doc update").
#
# Triggered on:
#   - pull_request_target (with `permissions.pull-requests: write`)
#     so the action can apply labels. The bare `pull_request` event
#     runs in a forked PR's context with no write perms — labels
#     would silently no-op. `pull_request_target` runs in the base
#     repo's context with the maintainer's token; safe here because
#     we only read the file list, never check out the fork's code.

name: PR Auto-label

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

# Cancel superseded labeler runs on the same PR. The group keys on the PR
# number, not `github.ref` as ci.yml does, because `pull_request_target`
# sets `github.ref` to the base branch (refs/heads/main). Keying on the
# ref would cancel labeler runs across all open PRs, not just this PR's
# earlier runs.
concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    name: Apply labels by changed paths
    runs-on: ubuntu-latest
    # Budget cap. Vendored JS action, ~10 s real time;
    # 5 min handles a GitHub API rate-limit retry.
    timeout-minutes: 5
    steps:
      # The `actions/labeler` action vendors all the logic itself —
      # no setup-node / etc. needed. The immutable SHA below is the
      # reviewed v7.0.0 release; Dependabot keeps the pin current.
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          configuration-path: .github/labeler.yml
          # Additive only. With `sync-labels: false` (also the action's
          # default), the labeler never removes a label from the PR, even one
          # a maintainer applied or one whose matching files were reverted.
          sync-labels: false
