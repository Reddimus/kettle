name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: kettle-linux-x86_64.tar.gz
          - os: macos-latest
            artifact: kettle-macos-universal.zip
          - os: windows-latest
            artifact: kettle-windows-x86_64.zip
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libfreetype6-dev \
            libx11-dev libxkbcommon-dev libwayland-dev libxcb1-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p kettle

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/kettle
          cp target/release/kettle dist/kettle/
          cp LICENSE NOTICE README.md dist/kettle/
          cp packaging/linux/kettle.desktop dist/kettle/
          tar -C dist -czf ${{ matrix.artifact }} kettle

      - name: Package (macOS .app bundle)
        if: runner.os == 'macOS'
        run: |
          APP=dist/kettle.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp packaging/macos/Info.plist "$APP/Contents/Info.plist"
          cp target/release/kettle "$APP/Contents/MacOS/kettle"
          cp LICENSE NOTICE README.md "$APP/Contents/Resources/"
          (cd dist && zip -r ../${{ matrix.artifact }} kettle.app)

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/kettle | Out-Null
          Copy-Item target/release/kettle.exe dist/kettle/
          Copy-Item LICENSE,NOTICE,README.md dist/kettle/
          Compress-Archive -Path dist/kettle/* -DestinationPath ${{ matrix.artifact }} -Force

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
          generate_release_notes: true
