name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Cycle 723 (2026-05-23): test-before-release gate. Before
  # release.yml started running `cargo test` the package job built
  # release artifacts blindly — if the tagged commit was a broken
  # one (rare, but possible if a hotfix branch was tagged without
  # ci.yml having run on it yet), we'd ship broken binaries. The
  # Linux-only quick gauntlet here is ~5 min and runs before the
  # ~30-40 min per-OS package builds; cheap insurance.
  pretest:
    name: pretest (release gate)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libfreetype6-dev \
            libx11-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libxcb1-dev mesa-vulkan-drivers libvulkan1 xvfb
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-pretest
      - run: cargo test --workspace

  package:
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Cycle 723: package only runs after pretest passes. A red
    # `cargo test --workspace` blocks the per-OS builds before
    # they consume runner minutes.
    needs: pretest
    # Cycle 600 budget cap. Release builds compile in --release mode
    # (slow), bundle assets, hash, and upload — real time runs
    # ~25-40 min per OS. 75 min is ~2× headroom for a slow runner
    # without giving a hang the full 6-hour default. NOTE: unlike
    # ci.yml (cycle 597), release.yml is NOT covered by cancel-in-
    # progress concurrency — a release must always complete, never
    # be canceled mid-upload (cycle-558 incident recovery).
    timeout-minutes: 75
    # Cycle 767: the aarch64-linux cross-build entry is `experimental` —
    # `continue-on-error` so a hiccup in the (newer, cross-compiled) ARM64
    # artifact never blocks the established x86_64/macOS/Windows artifacts.
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: kettle-linux-x86_64.tar.gz
          - os: macos-latest
            artifact: kettle-macos-universal.zip
          - os: windows-latest
            artifact: kettle-windows-x86_64.zip
          # Cycle 767: ARM64 Linux (Raspberry Pi 4/5, ARM servers/VPS, ARM
          # laptops on Linux). Cross-compiled on the x86_64 ubuntu runner — the
          # ci.yml early-warning job proves this target builds. Windowing deps
          # load via dlopen, so only the GNU cross-linker is needed.
          - os: ubuntu-latest
            artifact: kettle-linux-aarch64.tar.gz
            rust_target: aarch64-unknown-linux-gnu
            experimental: true
    steps:
      - uses: actions/checkout@v6
      # Guard against tagging drift — if someone tags `v1.3.10` but
      # forgot to bump `Cargo.toml` from `1.3.9`, the artifacts here
      # would end up with mixed versions (macOS .app bundle would say
      # 1.3.9 via the cycle-159 Info.plist patch; the binary's own
      # `--version` output would also say 1.3.9; only the tag would
      # claim 1.3.10). Fail fast before any build kicks off so the
      # fix is a tag retag, not a publish-then-yank.
      - name: Tag ↔ Cargo.toml ↔ CHANGELOG consistency
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Linux'
        shell: bash
        run: |
          # `github.ref_name` for a tag push is the bare tag string
          # (e.g. `v1.3.9`). Strip the leading `v`.
          TAG_VER="${GITHUB_REF_NAME#v}"
          CARGO_VER=$(awk -F\" '/^version = / { print $2; exit }' Cargo.toml)
          if [ "$TAG_VER" != "$CARGO_VER" ]; then
            echo "::error::tag $GITHUB_REF_NAME implies version $TAG_VER but Cargo.toml says $CARGO_VER"
            echo "::error::either retag with v$CARGO_VER or bump Cargo.toml to $TAG_VER first"
            exit 1
          fi
          # Cycle 286: also verify CHANGELOG.md has a section for this
          # version. A release without a CHANGELOG entry leaves users
          # who hit `kettle --version` then look at the project's
          # release notes wondering what changed. Auto-generated
          # release notes from softprops cover commit messages but
          # not the human-curated [Unreleased] → [vX.Y.Z] promotion
          # which is what the repo's Keep-a-Changelog format relies
          # on.
          # Cycle 765: enforce the full '## [X.Y.Z] — YYYY-MM-DD' form, matching
          # scripts/release.sh's check. The looser '^## \[ver\]' pattern would
          # accept an undated '## [2.2.1]' heading, shipping a release whose
          # CHANGELOG entry is missing its date.
          if ! grep -qE "^## \[${TAG_VER}\] — [0-9]{4}-[0-9]{2}-[0-9]{2}\$" CHANGELOG.md; then
            echo "::error::tag $GITHUB_REF_NAME but CHANGELOG.md has no '## [$TAG_VER] — YYYY-MM-DD' section"
            echo "::error::promote the [Unreleased] block to '## [$TAG_VER] — YYYY-MM-DD' (with the date) before tagging"
            exit 1
          fi
          # Cycle 550: also assert flake.nix's hardcoded version
          # matches. The Nix-side string drifted 39 releases (cycle
          # 549 catch); scripts/release.sh now auto-bumps it, but
          # a forgotten flake.nix bump should fail the release
          # workflow, not silently ship a Nix derivation with wrong
          # metadata.
          if [ -f flake.nix ]; then
            FLAKE_VER=$(awk -F\" '/^          version = / { print $2; exit }' flake.nix)
            if [ -n "$FLAKE_VER" ] && [ "$TAG_VER" != "$FLAKE_VER" ]; then
              echo "::error::tag $GITHUB_REF_NAME but flake.nix says $FLAKE_VER"
              echo "::error::scripts/release.sh auto-bumps this — re-run it or edit flake.nix"
              exit 1
            fi
          fi
          # Cycle 558: PKGBUILD + kettle.rb template gates from
          # cycle 553 were REVERTED. The original intent (catch
          # forgotten packaging-template bumps) was sound, but
          # creates a circular dependency:
          #   - release.sh can't auto-bump them because their
          #     sha256sums require post-CI artifacts (the
          #     kettle-{linux,macos}-*.sha256 sidecars).
          #   - The sidecars only exist AFTER release.yml uploads
          #     them — which can't happen if a pre-flight gate
          #     fails on the bump.
          # The cycle 553 strict-equality gate blocked v1.43.0
          # release artifacts entirely because PKGBUILD/kettle.rb
          # carry the previous release's sha256s by design (the
          # "trail by one" pattern: template at v(N-1) is the
          # last KNOWN-GOOD AUR/Homebrew target). The cycle 549/
          # 551/552 reactive bumps remain the right cadence —
          # update templates when the maintainer re-publishes to
          # AUR/tap, not on every tag push.
          echo "tag, Cargo.toml, flake.nix, and CHANGELOG.md all agree on version $TAG_VER"
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libfreetype6-dev \
            libx11-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev
      - uses: Swatinem/rust-cache@v2
      # Build: macOS gets a real universal2 binary (cycle 159 — the
      # artifact has been named `kettle-macos-universal.zip` since
      # cycle 0 but the underlying binary was single-arch from
      # whatever runner architecture macos-latest happened to be).
      # Linux + Windows: native release build.
      - name: Build (macOS universal)
        if: runner.os == 'macOS'
        run: |
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin -p kettle
          cargo build --release --target aarch64-apple-darwin -p kettle
          mkdir -p target/release
          lipo -create \
            target/x86_64-apple-darwin/release/kettle \
            target/aarch64-apple-darwin/release/kettle \
            -output target/release/kettle
          file target/release/kettle
      - name: Build (Linux / Windows)
        if: runner.os != 'macOS' && matrix.rust_target == ''
        run: cargo build --release -p kettle

      # Cycle 767: ARM64 Linux cross-build. The runner is x86_64; install the
      # aarch64 std + GNU cross-linker and build for the target, then copy the
      # binary to the host-build path so the unchanged Package (Linux) step
      # picks it up. Mirrors ci.yml's aarch64 early-warning job.
      - name: Build (Linux aarch64 cross)
        if: matrix.rust_target == 'aarch64-unknown-linux-gnu'
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
          rustup target add aarch64-unknown-linux-gnu
          cargo build --release --target aarch64-unknown-linux-gnu -p kettle
          mkdir -p target/release
          cp target/aarch64-unknown-linux-gnu/release/kettle target/release/kettle

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/kettle/packaging/linux
          cp target/release/kettle dist/kettle/
          cp LICENSE NOTICE README.md CHANGELOG.md dist/kettle/
          # Desktop integration assets — packaged at the SAME relative
          # paths the in-tree `scripts/install.sh` expects, so a user
          # who extracts the tarball can run `./kettle/install.sh` and
          # get the binary + icon + .desktop entry installed under
          # ~/.local/ without any further steps.
          cp packaging/linux/kettle.desktop dist/kettle/packaging/linux/
          cp packaging/linux/kettle.svg     dist/kettle/packaging/linux/
          cp packaging/linux/kettle-*.png   dist/kettle/packaging/linux/ || true
          # Cycle 279: man page ships with the Linux tarball so the
          # bundled install.sh can drop it into ~/.local/share/man/man1.
          cp packaging/linux/kettle.1       dist/kettle/packaging/linux/
          install -Dm755 scripts/install.sh dist/kettle/install.sh
          # Cycle 230: also ship the OSC 133 shell-integration snippets
          # so a user can read/customize them before sourcing. The same
          # bodies are embedded into the binary via include_str! (cycle
          # 229), so `./kettle/kettle --shell-integration bash >> ~/.bashrc`
          # works without these files; they're a discoverability +
          # source-of-truth aid, not a runtime requirement.
          cp -r shell-integration dist/kettle/
          tar -C dist -czf ${{ matrix.artifact }} kettle

      - name: Package (macOS .app bundle)
        if: runner.os == 'macOS'
        run: |
          APP=dist/kettle.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          # Convert the maintained .iconset directory to .icns using
          # Apple's own iconutil — only available on macOS. The result
          # lands at Resources/kettle.icns and the Info.plist's
          # CFBundleIconFile=kettle (no extension) picks it up so the
          # Finder, Dock, and ⌘-Tab switcher all show our icon.
          iconutil -c icns packaging/macos/kettle.iconset \
            -o "$APP/Contents/Resources/kettle.icns"
          # Patch the Info.plist version from the workspace Cargo.toml
          # at release time so a CFBundleVersion drift from a forgotten
          # manual bump can't ship. PlistBuddy is built into macOS.
          VERSION=$(awk -F\" '/^version = / { print $2; exit }' Cargo.toml)
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VERSION" \
            packaging/macos/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" \
            packaging/macos/Info.plist
          cp packaging/macos/Info.plist "$APP/Contents/Info.plist"
          cp target/release/kettle "$APP/Contents/MacOS/kettle"
          cp LICENSE NOTICE README.md CHANGELOG.md "$APP/Contents/Resources/"
          # Cycle 230: shell-integration snippets in Resources/ so a
          # macOS user can read them alongside the LICENSE / NOTICE
          # without needing the source tree. Same content as the
          # binary's embedded copies (see cycle 229).
          cp -r shell-integration "$APP/Contents/Resources/"
          (cd dist && zip -r ../${{ matrix.artifact }} kettle.app)

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/kettle | Out-Null
          Copy-Item target/release/kettle.exe dist/kettle/
          # The .ico file is embedded into the .exe by build.rs +
          # winresource (see crates/kettle/Cargo.toml + build.rs); we
          # also ship the standalone .ico in the zip so Windows Start
          # menu pinning and right-click "Pin to taskbar" pick it up
          # if the user moves the .exe out of its install directory.
          Copy-Item packaging/windows/kettle.ico dist/kettle/
          Copy-Item LICENSE,NOTICE,README.md,CHANGELOG.md dist/kettle/
          # Cycle 230: shell-integration snippets — useful for Windows
          # users running Git Bash, MSYS2, or WSL inside kettle on
          # ConPTY. Same files as on the other platforms.
          Copy-Item -Recurse shell-integration dist/kettle/
          # Cycle 733: bundled install.ps1 puts kettle into
          # %LOCALAPPDATA%\Programs\kettle, creates a Start menu
          # shortcut (so Win-key search finds "kettle"), adds to user
          # PATH, and registers an Add/Remove Programs entry. Mirrors
          # the cycle-0 Linux install.sh + the macOS .app bundle's
          # Spotlight integration — pre-733 the Windows .zip was the
          # only release artifact that didn't surface in the OS app
          # launcher after the user extracted it.
          Copy-Item scripts/install.ps1 dist/kettle/
          Compress-Archive -Path dist/kettle/* -DestinationPath ${{ matrix.artifact }} -Force

      # Generate a SHA-256 sidecar for the artifact so users (and the
      # cycle-253 `install-online.sh` one-liner) can verify a download
      # before extracting. Output format matches `sha256sum` / `shasum
      # -a 256` so the standard verification incantation works as-is:
      #     sha256sum -c kettle-linux-x86_64.tar.gz.sha256
      # Each runner uses the native tool — `sha256sum` on Linux,
      # `shasum -a 256` on macOS, `Get-FileHash` on Windows.
      - name: Generate SHA-256 (Linux)
        if: runner.os == 'Linux'
        run: sha256sum "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
      - name: Generate SHA-256 (macOS)
        if: runner.os == 'macOS'
        run: shasum -a 256 "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
      - name: Generate SHA-256 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Emit the same `<hex>  <filename>` layout `sha256sum` does so
          # cross-platform verification doesn't need a parser per OS.
          $hash = (Get-FileHash -Algorithm SHA256 "${{ matrix.artifact }}").Hash.ToLower()
          Set-Content -NoNewline -Path "${{ matrix.artifact }}.sha256" -Value "$hash  ${{ matrix.artifact }}`n"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256
          generate_release_notes: true

      # Cycle 285 defense-in-depth. softprops/action-gh-release@v3
      # uploads via Octokit with no built-in retry — a transient
      # `uploads.github.com:443` Connect Timeout (which hit the v1.3.11
      # Linux runner and dropped the .sha256 sidecar) fails the whole
      # step. This follow-on step uses `gh release upload --clobber`
      # in a retry loop to fill any missing assets. If softprops
      # already uploaded everything, every upload no-ops (the
      # `--clobber` flag refreshes existing assets idempotently). If
      # softprops dropped one, this step retries it 3 times with 5s
      # backoff before giving up. Net effect: a single transient
      # timeout per artifact no longer drops a sidecar.
      - name: Verify + retry-upload missing assets
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for file in "${{ matrix.artifact }}" "${{ matrix.artifact }}.sha256"; do
            for attempt in 1 2 3; do
              if gh release upload "$GITHUB_REF_NAME" "$file" --clobber; then
                echo "ensured $file is attached"
                break
              fi
              echo "upload of $file failed (attempt $attempt/3) — retrying in 5s"
              sleep 5
              if [ "$attempt" = "3" ]; then
                echo "::error::failed to upload $file after 3 attempts"
                exit 1
              fi
            done
          done
