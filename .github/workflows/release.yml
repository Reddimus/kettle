name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # (2026-05-23): test-before-release gate. Before
  # release.yml started running `cargo test` the package job built
  # release artifacts blindly — if the tagged commit was a broken
  # one (rare, but possible if a hotfix branch was tagged without
  # ci.yml having run on it yet), we'd ship broken binaries. The
  # Linux-only quick gauntlet here is ~5 min and runs before the
  # ~30-40 min per-OS package builds; cheap insurance.
  pretest:
    name: pretest (release gate)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require a GitHub-verified annotated tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ref=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}")
          type=$(jq -r '.object.type' <<<"$ref")
          sha=$(jq -r '.object.sha' <<<"$ref")
          if [ "$type" != tag ]; then
            echo "::error::$GITHUB_REF_NAME is lightweight; releases require a signed annotated tag"
            exit 1
          fi
          verified=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${sha}" --jq '.verification.verified')
          if [ "$verified" != true ]; then
            echo "::error::$GITHUB_REF_NAME does not have a GitHub-verified signature"
            exit 1
          fi
          git fetch --no-tags origin main
          tagged_commit=$(git rev-list -n 1 "$GITHUB_REF_NAME")
          main_commit=$(git rev-parse origin/main)
          if [ "$tagged_commit" != "$main_commit" ]; then
            echo "::error::$GITHUB_REF_NAME points to $tagged_commit, not origin/main $main_commit"
            exit 1
          fi
          echo "$GITHUB_REF_NAME is an annotated tag with a verified signature"
      # The tag ↔ Cargo.toml ↔ flake.nix ↔ CHANGELOG
      # consistency gate runs HERE in the single-Linux pretest — before any
      # per-OS package build — so a version mismatch fails fast and BLOCKS all
      # platform builds. Previously it lived in the package matrix gated on
      # `runner.os == 'Linux'`, so macOS/Windows could build + upload artifacts
      # while only the Linux leg caught the mismatch (a partial-release risk).
      - name: Tag ↔ Cargo.toml ↔ flake.nix ↔ CHANGELOG consistency
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          # `github.ref_name` for a tag push is the bare tag string
          # (e.g. `v1.3.9`). Strip the leading `v`.
          TAG_VER="${GITHUB_REF_NAME#v}"
          CARGO_VER=$(awk -F\" '/^version = / { print $2; exit }' Cargo.toml)
          if [ "$TAG_VER" != "$CARGO_VER" ]; then
            echo "::error::tag $GITHUB_REF_NAME implies version $TAG_VER but Cargo.toml says $CARGO_VER"
            echo "::error::either retag with v$CARGO_VER or bump Cargo.toml to $TAG_VER first"
            exit 1
          fi
          # CHANGELOG.md must carry the dated '## [X.Y.Z] —
          # YYYY-MM-DD' section for this version (matches scripts/release.sh).
          if ! grep -qE "^## \[${TAG_VER}\] — [0-9]{4}-[0-9]{2}-[0-9]{2}\$" CHANGELOG.md; then
            echo "::error::tag $GITHUB_REF_NAME but CHANGELOG.md has no '## [$TAG_VER] — YYYY-MM-DD' section"
            echo "::error::promote the [Unreleased] block to '## [$TAG_VER] — YYYY-MM-DD' (with the date) before tagging"
            exit 1
          fi
          # flake.nix's hardcoded version must match (release.sh
          # auto-bumps it; a forgotten bump should fail the release, not ship a
          # Nix derivation with wrong metadata).
          if [ -f flake.nix ]; then
            FLAKE_VER=$(awk -F\" '/^          version = / { print $2; exit }' flake.nix)
            if [ -n "$FLAKE_VER" ] && [ "$TAG_VER" != "$FLAKE_VER" ]; then
              echo "::error::tag $GITHUB_REF_NAME but flake.nix says $FLAKE_VER"
              echo "::error::scripts/release.sh auto-bumps this — re-run it or edit flake.nix"
              exit 1
            fi
          fi
          echo "tag, Cargo.toml, flake.nix, and CHANGELOG.md all agree on version $TAG_VER"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
      - name: Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libfreetype6-dev \
            libx11-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libxcb1-dev mesa-vulkan-drivers libvulkan1 xvfb
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: release-pretest
      - run: cargo test --workspace

  package:
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Package only runs after pretest passes. A red
    # `cargo test --workspace` blocks the per-OS builds before
    # they consume runner minutes.
    needs: pretest
    # Budget cap. Release builds compile in --release mode
    # (slow), bundle assets, hash, and upload — real time runs
    # ~25-40 min per OS. 75 min is ~2× headroom for a slow runner
    # without giving a hang the full 6-hour default. NOTE: unlike
    # ci.yml, release.yml is NOT covered by cancel-in-
    # progress concurrency — a release must always complete, never
    # be canceled mid-upload (a lesson from the v1.43.0 partial
    # release, which shipped macOS/Windows assets but no Linux one).
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: kettle-linux-x86_64.tar.gz
          - os: macos-latest
            artifact: kettle-macos-universal.zip
          - os: windows-latest
            artifact: kettle-windows-x86_64.zip
          # ARM64 Linux (Raspberry Pi 4/5, ARM servers/VPS, ARM
          # laptops on Linux). Cross-compiled on the x86_64 ubuntu runner — the
          # ci.yml early-warning job proves this target builds. Windowing deps
          # load via dlopen, so only the GNU cross-linker is needed.
          - os: ubuntu-latest
            artifact: kettle-linux-aarch64.tar.gz
            rust_target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The tag ↔ Cargo.toml ↔ flake.nix ↔ CHANGELOG
      # consistency gate moved to the `pretest` job (single Linux, runs before
      # any per-OS build) so a version mismatch blocks ALL platform builds,
      # rather than letting macOS/Windows publish artifacts while only the Linux
      # package leg caught it (partial-release risk). See the `pretest` job above.
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libfreetype6-dev \
            libx11-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        # Key the cache per artifact so the two ubuntu-latest
        # legs (x86_64 + aarch64) don't share one cache and thrash each other's
        # target dir — mirrors how ci.yml keys its msrv/nightly/aarch64 legs.
        with:
          shared-key: ${{ matrix.artifact }}
      # Build: macOS gets a real universal2 binary — the
      # artifact has been named `kettle-macos-universal.zip` since the
      # project's earliest releases, but the underlying binary was
      # single-arch from whatever runner architecture macos-latest
      # happened to be until this build step fixed it.
      # Linux + Windows: native release build.
      - name: Build (macOS universal)
        if: runner.os == 'macOS'
        run: |
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin -p kettle
          cargo build --release --target aarch64-apple-darwin -p kettle
          mkdir -p target/release
          lipo -create \
            target/x86_64-apple-darwin/release/kettle \
            target/aarch64-apple-darwin/release/kettle \
            -output target/release/kettle
          file target/release/kettle
      - name: Build (Linux / Windows)
        if: runner.os != 'macOS' && matrix.rust_target == ''
        run: cargo build --release -p kettle

      # ARM64 Linux cross-build. The runner is x86_64; install the
      # aarch64 std + GNU cross-linker and build for the target, then copy the
      # binary to the host-build path so the unchanged Package (Linux) step
      # picks it up. Mirrors ci.yml's aarch64 early-warning job.
      - name: Build (Linux aarch64 cross)
        if: matrix.rust_target == 'aarch64-unknown-linux-gnu'
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
          rustup target add aarch64-unknown-linux-gnu
          cargo build --release --target aarch64-unknown-linux-gnu -p kettle
          mkdir -p target/release
          cp target/aarch64-unknown-linux-gnu/release/kettle target/release/kettle

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/kettle/packaging/linux
          cp target/release/kettle dist/kettle/
          cp LICENSE NOTICE README.md CHANGELOG.md dist/kettle/
          # Desktop integration assets — packaged at the SAME relative
          # paths the in-tree `scripts/install.sh` expects, so a user
          # who extracts the tarball can run `./kettle/install.sh` and
          # get the binary + icon + .desktop entry installed under
          # ~/.local/ without any further steps.
          cp packaging/linux/kettle.desktop dist/kettle/packaging/linux/
          cp packaging/linux/kettle.svg     dist/kettle/packaging/linux/
          # No `|| true` here — a missing or renamed icon raster
          # must FAIL the release loudly rather than silently ship an
          # iconless tarball. The 7 sizes are committed and regenerated by
          # scripts/gen-icons.sh, so the glob always matches in a clean tree.
          cp packaging/linux/kettle-*.png   dist/kettle/packaging/linux/
          # Man page ships with the Linux tarball so the
          # bundled install.sh can drop it into ~/.local/share/man/man1.
          cp packaging/linux/kettle.1       dist/kettle/packaging/linux/
          install -Dm755 scripts/install.sh dist/kettle/install.sh
          # Also ship the OSC 133 shell-integration snippets
          # so a user can read/customize them before sourcing. The same
          # bodies are embedded into the binary via include_str!,
          # so `./kettle/kettle --shell-integration bash >> ~/.bashrc`
          # works without these files; they're a discoverability +
          # source-of-truth aid, not a runtime requirement.
          cp -r shell-integration dist/kettle/
          VERSION=$(awk -F\" '/^version = / { print $2; exit }' Cargo.toml)
          TARGET="${{ matrix.rust_target }}"
          if [ -z "$TARGET" ]; then
            TARGET=x86_64-unknown-linux-gnu
          fi
          python3 scripts/package-manifest.py generate \
            --root dist/kettle --target "$TARGET" --version "$VERSION"
          python3 scripts/package-manifest.py verify \
            --root dist/kettle --target "$TARGET" --version "$VERSION"
          tar -C dist -czf ${{ matrix.artifact }} kettle

      - name: Package (macOS .app bundle)
        if: runner.os == 'macOS'
        run: |
          APP=dist/kettle.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          # Convert the maintained .iconset directory to .icns using
          # Apple's own iconutil — only available on macOS. The result
          # lands at Resources/kettle.icns and the Info.plist's
          # CFBundleIconFile=kettle (no extension) picks it up so the
          # Finder, Dock, and ⌘-Tab switcher all show our icon.
          iconutil -c icns packaging/macos/kettle.iconset \
            -o "$APP/Contents/Resources/kettle.icns"
          # Patch the Info.plist version from the workspace Cargo.toml
          # at release time so a CFBundleVersion drift from a forgotten
          # manual bump can't ship. PlistBuddy is built into macOS.
          VERSION=$(awk -F\" '/^version = / { print $2; exit }' Cargo.toml)
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VERSION" \
            packaging/macos/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" \
            packaging/macos/Info.plist
          cp packaging/macos/Info.plist "$APP/Contents/Info.plist"
          cp target/release/kettle "$APP/Contents/MacOS/kettle"
          cp LICENSE NOTICE README.md CHANGELOG.md "$APP/Contents/Resources/"
          # Shell-integration snippets in Resources/ so a
          # macOS user can read them alongside the LICENSE / NOTICE
          # without needing the source tree. Same content as the
          # binary's embedded copies.
          cp -r shell-integration "$APP/Contents/Resources/"
          (cd dist && zip -r ../${{ matrix.artifact }} kettle.app)

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/kettle | Out-Null
          Copy-Item target/release/kettle.exe dist/kettle/
          # Windows resolves .com before .exe for a bare command. This console
          # shim waits for CLI prompts and exit codes; Start Menu still targets
          # the no-console GUI executable directly.
          Copy-Item target/release/kettle-console.exe dist/kettle/kettle.com
          # The .ico file is embedded into the .exe by build.rs +
          # winresource (see crates/kettle/Cargo.toml + build.rs); we
          # also ship the standalone .ico in the zip so Windows Start
          # menu pinning and right-click "Pin to taskbar" pick it up
          # if the user moves the .exe out of its install directory.
          Copy-Item packaging/windows/kettle.ico dist/kettle/
          Copy-Item LICENSE,NOTICE,README.md,CHANGELOG.md dist/kettle/
          # Shell-integration snippets — useful for Windows
          # users running Git Bash, MSYS2, or WSL inside kettle on
          # ConPTY. Same files as on the other platforms.
          Copy-Item -Recurse shell-integration dist/kettle/
          # Bundled install.ps1 puts kettle into
          # %LOCALAPPDATA%\Programs\kettle, creates a Start menu
          # shortcut (so Win-key search finds "kettle"), adds to user
          # PATH, and registers an Add/Remove Programs entry. Mirrors
          # the Linux install.sh + the macOS .app bundle's
          # Spotlight integration — before this script existed, the
          # Windows .zip was the only release artifact that didn't
          # surface in the OS app launcher after the user extracted it.
          Copy-Item scripts/install.ps1 dist/kettle/
          $version = (Select-String '^version = "([^"]+)"' Cargo.toml | Select-Object -First 1).Matches.Groups[1].Value
          python scripts/package-manifest.py generate `
            --root dist/kettle --target x86_64-pc-windows-msvc --version $version
          python scripts/package-manifest.py verify `
            --root dist/kettle --target x86_64-pc-windows-msvc --version $version
          Compress-Archive -Path dist/kettle/* -DestinationPath ${{ matrix.artifact }} -Force

      # Generate a SHA-256 sidecar for the artifact so users (and the
      # `install-online.sh` one-liner) can verify a download
      # before extracting. Output format matches `sha256sum` / `shasum
      # -a 256` so the standard verification incantation works as-is:
      #     sha256sum -c kettle-linux-x86_64.tar.gz.sha256
      # Each runner uses the native tool — `sha256sum` on Linux,
      # `shasum -a 256` on macOS, `Get-FileHash` on Windows.
      - name: Generate SHA-256 (Linux)
        if: runner.os == 'Linux'
        run: sha256sum "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
      - name: Generate SHA-256 (macOS)
        if: runner.os == 'macOS'
        run: shasum -a 256 "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
      - name: Generate SHA-256 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Emit the same `<hex>  <filename>` layout `sha256sum` does so
          # cross-platform verification doesn't need a parser per OS.
          $hash = (Get-FileHash -Algorithm SHA256 "${{ matrix.artifact }}").Hash.ToLower()
          Set-Content -NoNewline -Path "${{ matrix.artifact }}.sha256" -Value "$hash  ${{ matrix.artifact }}`n"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          retention-days: 7
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256

  finalize:
    name: sign and publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [pretest, package]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release-signing
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Verify complete platform artifact set
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          required=(
            kettle-linux-x86_64.tar.gz
            kettle-linux-aarch64.tar.gz
            kettle-windows-x86_64.zip
            kettle-macos-universal.zip
          )
          for artifact in "${required[@]}"; do
            test -s "$artifact"
            test -s "$artifact.sha256"
            sha256sum -c "$artifact.sha256"
          done

      - name: Verify inner package manifests from final archives
        shell: bash
        run: |
          set -euo pipefail
          extracted=$(mktemp -d)
          trap 'rm -rf "$extracted"' EXIT
          mkdir -p "$extracted/linux-x86_64" "$extracted/linux-aarch64" "$extracted/windows"
          tar -xzf dist/kettle-linux-x86_64.tar.gz -C "$extracted/linux-x86_64"
          tar -xzf dist/kettle-linux-aarch64.tar.gz -C "$extracted/linux-aarch64"
          unzip -q dist/kettle-windows-x86_64.zip -d "$extracted/windows"
          VERSION="${GITHUB_REF_NAME#v}"
          python3 scripts/package-manifest.py verify \
            --root "$extracted/linux-x86_64/kettle" \
            --target x86_64-unknown-linux-gnu --version "$VERSION"
          python3 scripts/package-manifest.py verify \
            --root "$extracted/linux-aarch64/kettle" \
            --target aarch64-unknown-linux-gnu --version "$VERSION"
          python3 scripts/package-manifest.py verify \
            --root "$extracted/windows" \
            --target x86_64-pc-windows-msvc --version "$VERSION"

      - name: Build deterministic signed update feed
        shell: bash
        env:
          KETTLE_UPDATE_SIGNING_KEY_PEM: ${{ secrets.KETTLE_UPDATE_SIGNING_KEY_PEM }}
        run: |
          set -euo pipefail
          if [ -z "$KETTLE_UPDATE_SIGNING_KEY_PEM" ]; then
            echo "::error::release-signing environment is missing KETTLE_UPDATE_SIGNING_KEY_PEM"
            exit 1
          fi
          published_at=$(git show -s --format=%cI "$GITHUB_SHA")
          python3 scripts/make-update-manifest.py \
            --tag "$GITHUB_REF_NAME" \
            --published-at "$published_at" \
            --asset "x86_64-pc-windows-msvc=dist/kettle-windows-x86_64.zip" \
            --asset "x86_64-unknown-linux-gnu=dist/kettle-linux-x86_64.tar.gz" \
            --asset "aarch64-unknown-linux-gnu=dist/kettle-linux-aarch64.tar.gz" \
            --output dist/kettle-update-manifest.json

          key=$(mktemp)
          payload=$(mktemp)
          signature=$(mktemp)
          trap 'rm -f "$key" "$payload" "$signature"' EXIT
          chmod 600 "$key"
          printf '%s\n' "$KETTLE_UPDATE_SIGNING_KEY_PEM" > "$key"
          printf 'kettle-update-manifest-v1\0' > "$payload"
          cat dist/kettle-update-manifest.json >> "$payload"
          openssl pkeyutl -sign -rawin -inkey "$key" -in "$payload" -out "$signature"
          base64 -w 0 "$signature" > dist/kettle-update-manifest.json.sig
          printf '\n' >> dist/kettle-update-manifest.json.sig

          openssl pkey -in "$key" -pubout > update-public.pem
          openssl pkeyutl -verify -rawin -pubin -inkey update-public.pem \
            -in "$payload" -sigfile "$signature"
          rm -f update-public.pem
          (
            cd dist
            sha256sum kettle-update-manifest.json > kettle-update-manifest.json.sha256
            sha256sum kettle-update-manifest.json.sig > kettle-update-manifest.json.sig.sha256
            sha256sum -c kettle-update-manifest.json.sha256
            sha256sum -c kettle-update-manifest.json.sig.sha256
          )

      - name: Render package-manager metadata from verified archives
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/render-package-templates.py \
            --version "${GITHUB_REF_NAME#v}" \
            --macos-archive dist/kettle-macos-universal.zip \
            --linux-x86-64-archive dist/kettle-linux-x86_64.tar.gz \
            --output-dir dist/package-metadata
          grep -q "^  version \"${GITHUB_REF_NAME#v}\"$" dist/package-metadata/kettle.rb
          grep -q "^pkgver=${GITHUB_REF_NAME#v}$" dist/package-metadata/PKGBUILD

      - name: Upload a complete draft, verify it, then publish once
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            draft=$(gh release view "$tag" --json isDraft --jq '.isDraft')
            if [ "$draft" != true ]; then
              echo "::error::release $tag already exists and is public"
              exit 1
            fi
          else
            gh release create "$tag" --verify-tag --draft --generate-notes --title "$tag"
          fi

          files=(
            dist/kettle-linux-x86_64.tar.gz
            dist/kettle-linux-x86_64.tar.gz.sha256
            dist/kettle-linux-aarch64.tar.gz
            dist/kettle-linux-aarch64.tar.gz.sha256
            dist/kettle-windows-x86_64.zip
            dist/kettle-windows-x86_64.zip.sha256
            dist/kettle-macos-universal.zip
            dist/kettle-macos-universal.zip.sha256
            dist/kettle-update-manifest.json
            dist/kettle-update-manifest.json.sig
            dist/kettle-update-manifest.json.sha256
            dist/kettle-update-manifest.json.sig.sha256
            dist/package-metadata/kettle.rb
            dist/package-metadata/PKGBUILD
          )
          for attempt in 1 2 3; do
            if gh release upload "$tag" "${files[@]}" --clobber; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "::error::release asset upload failed after 3 attempts"
              exit 1
            fi
            sleep 5
          done

          gh release view "$tag" --json assets > release-assets.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          expected = {path.name: path.stat().st_size for path in map(Path, [
              "dist/kettle-linux-x86_64.tar.gz",
              "dist/kettle-linux-x86_64.tar.gz.sha256",
              "dist/kettle-linux-aarch64.tar.gz",
              "dist/kettle-linux-aarch64.tar.gz.sha256",
              "dist/kettle-windows-x86_64.zip",
              "dist/kettle-windows-x86_64.zip.sha256",
              "dist/kettle-macos-universal.zip",
              "dist/kettle-macos-universal.zip.sha256",
              "dist/kettle-update-manifest.json",
              "dist/kettle-update-manifest.json.sig",
              "dist/kettle-update-manifest.json.sha256",
              "dist/kettle-update-manifest.json.sig.sha256",
              "dist/package-metadata/kettle.rb",
              "dist/package-metadata/PKGBUILD",
          ])}
          actual = {asset["name"]: asset["size"] for asset in json.load(open("release-assets.json"))["assets"]}
          if actual != expected:
              raise SystemExit(f"release asset mismatch\nexpected={expected}\nactual={actual}")
          PY
          gh release edit "$tag" --draft=false --latest
