# cargo-machete — catch unused workspace dependencies before they land.
# Pairs with the audit + deny workflows: every
# `cargo add` PR now passes through three supply-chain checks:
#
#   audit.yml      — RustSec security advisories
#   deny.yml       — licenses, sources, banned crates
#   machete.yml    — actually-used (this one)
#
# Each one catches a class the others miss. cargo-machete finds
# dependencies declared in `Cargo.toml` but never imported in source,
# so a dep added "just in case" is flagged at PR time.
name: cargo-machete

on:
  push:
    branches: [main]
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".github/workflows/machete.yml"
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".github/workflows/machete.yml"
  # Weekly cron. The push/PR triggers above are path-filtered to Cargo
  # manifests, so a source-only change that drops a dependency's last use
  # would otherwise go unchecked. Mirrors deny.yml's Sunday 06:00 UTC slot.
  schedule:
    - cron: "0 6 * * 0"

permissions:
  contents: read

# Same concurrency block as ci.yml + actionlint.yml. A
# weekly cron (see above) but no release artifacts, purely diagnostic — cancel-in-progress
# is strictly a budget win when a Cargo.toml-touching PR gets
# multiple pushes in quick succession.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  machete:
    name: unused deps
    runs-on: ubuntu-latest
    # Budget cap. cargo-machete runs in <1 min real time;
    # 10 min handles a cold rust-cache restore.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: machete
      # `bnjbvr/cargo-machete` is the upstream maintainer's official
      # action. The immutable SHA is v0.9.2; the action vendors
      # cargo-machete so no separate `cargo install` step is needed.
      - uses: bnjbvr/cargo-machete@ac30a525c0a8d163a92d727b3ff079ee3f6ecb08 # v0.9.2
