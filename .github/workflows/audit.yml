# Security audit — runs `cargo audit` against the RustSec advisory DB so a
# newly-published vulnerability in any transitive dep surfaces as a CI
# failure within a day instead of at the next release cut.
#
# Runs on:
#   - every push/PR that touches Cargo.lock or this workflow (fast feedback)
#   - a daily 06:00 UTC cron so an advisory published *after* a Cargo.lock
#     change still surfaces on its own (dependabot picks up the patched
#     dep on Monday; this catches the window in between).
#
# Linux-only — `cargo audit` is platform-agnostic and the advisory DB lives
# in one place; running on three OSes would be triple cache + triple noise.
name: Audit

on:
  push:
    branches: [main]
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".github/workflows/audit.yml"
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".github/workflows/audit.yml"
  schedule:
    # 06:00 UTC daily — far enough off Dependabot's Monday-08:00 cadence to
    # catch the gap, far enough off CI-peak hours to keep Actions queues quiet.
    - cron: "0 6 * * *"

permissions:
  contents: read
  # rustsec/audit-check uses the Checks API to annotate the run summary
  # with each finding; without `checks: write` it errors with "Resource
  # not accessible by integration" because an explicit `permissions:`
  # block zeroes everything not listed.
  checks: write
  # On push to the default branch the action opens (or updates) a single
  # tracking issue per finding (idempotent) instead of spamming new
  # issues every run.
  issues: write

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Official RustSec action. Vendors `cargo-audit`, runs against the
      # advisory DB, posts a Checks-API annotation per finding, and on
      # `push` to `main` syncs a per-advisory tracking issue. The token
      # is the standard GITHUB_TOKEN; permissions come from the
      # workflow-level `permissions:` block above.
      #
      # `ignore`: RUSTSEC-2024-0436 is `paste` "no longer maintained" —
      # informational only (no vulnerability), and `paste` reaches us
      # purely through `image → rav1e → paste` (the AVIF decoder path).
      # We can't migrate upstream off `paste` from kettle's side; the
      # alternative is a permanently-red audit job, which trains the
      # team to ignore the signal we want it to keep. Revisit when
      # `rav1e` or `image` cut a release on `pastey`.
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ignore: RUSTSEC-2024-0436
