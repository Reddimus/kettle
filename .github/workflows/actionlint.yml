# actionlint — static analysis of every `.github/workflows/*.yml`.
#
# Why this is its own workflow (instead of folding into ci.yml):
#   - Triggers only on changes that touch the workflow files, so it
#     doesn't add ~30 s to every code-only PR.
#   - Runs the bundled `shellcheck` check on every `run: |` block
#     across all workflows in one pass — catches a dash-vs-bash
#     bug like cycle-253's (the bundled install.sh's
#     `set -o pipefail` was a Bash-only construct invoked via sh)
#     before the PR ships.
#   - Rejects mutable action references and catches malformed workflow
#     syntax before a workflow actually runs.
#
# Linux-only runner. The check is platform-agnostic and one OS is
# enough — same rationale as the cycle-219 rustdoc-on-Linux-only job.
name: actionlint

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/labeler.yml"
      - ".github/dependabot.yml"
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/labeler.yml"
      - ".github/dependabot.yml"

permissions:
  contents: read

# Cycle 598: cancel superseded runs on the same ref. Same shape as
# cycle 597's ci.yml concurrency block — no cron trigger here, no
# release artifacts, purely diagnostic, so cancel-in-progress is
# strictly a budget win. Workflow-files churn is rare but a rebase
# of a workflow-touching PR used to queue duplicate runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: lint workflows
    runs-on: ubuntu-latest
    # Cycle 600 budget cap. actionlint binary + scan runs in <30 s;
    # 5 min is generous and still well below the 360-min default.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Reject mutable action references
        shell: bash
        run: |
          set -euo pipefail
          pattern='^\s*(?:-\s*)?uses:\s+(?!\./)(?![^@[:space:]]+@[0-9a-f]{40}(?:[[:space:]]|$))'
          if rg --line-number --pcre2 "$pattern" .github/workflows; then
            echo '::error::external actions and workflows must use an immutable 40-character commit SHA'
            exit 1
          fi
      # Download a fixed actionlint release and authenticate the archive before
      # extracting it. Avoid executing a mutable raw.githubusercontent.com script.
      - name: Run actionlint
        shell: bash
        run: |
          set -euo pipefail
          archive=actionlint_1.7.12_linux_amd64.tar.gz
          curl --proto '=https' --tlsv1.2 --retry 5 --retry-all-errors -fsSLO \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.12/$archive"
          printf '%s  %s\n' \
            8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 \
            "$archive" | sha256sum --check --strict
          tar -xzf "$archive" actionlint
          ./actionlint -color
