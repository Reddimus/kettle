# actionlint — static analysis of every `.github/workflows/*.yml`.
#
# Why this is its own workflow (instead of folding into ci.yml):
#   - Triggers only on changes that touch the workflow files, so it
#     doesn't add ~30 s to every code-only PR.
#   - Runs the bundled `shellcheck` check on every `run: |` block
#     across all workflows in one pass — catches a dash-vs-bash
#     bug like the one in the bundled install.sh (`set -o pipefail`
#     was a Bash-only construct invoked via sh) before the PR ships.
#   - Rejects mutable action references and catches malformed workflow
#     syntax before a workflow actually runs.
#
# Linux-only runner. The check is platform-agnostic and one OS is
# enough — same rationale as the CI workflow's Rustdoc (Linux, warnings
# denied) job.
name: actionlint

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/labeler.yml"
      - ".github/dependabot.yml"
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/labeler.yml"
      - ".github/dependabot.yml"

permissions:
  contents: read

# Cancel superseded runs on the same ref. Same shape as ci.yml's
# concurrency block (added for the GitHub Actions budget-exhaustion
# incident) — no cron trigger here, no release artifacts, purely
# diagnostic, so cancel-in-progress is strictly a budget win.
# Workflow-files churn is rare but a rebase of a workflow-touching
# PR used to queue duplicate runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: lint workflows
    runs-on: ubuntu-latest
    # Budget cap: actionlint binary + scan runs in <30 s;
    # 5 min is generous and still well below the 360-min default.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reject mutable action references
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          workflow_files=(.github/workflows/*.yml .github/workflows/*.yaml)
          if [ "${#workflow_files[@]}" -eq 0 ]; then
            echo '::error::no workflow files found to scan'
            exit 1
          fi
          status=0
          perl -ne '
            if (/$ENV{ACTION_REF_PATTERN}/) {
              print "$ARGV:$.:$_";
              $found = 1;
            }
            close ARGV if eof;
            END { exit 1 if $found }
          ' "${workflow_files[@]}" || status=$?
          if [ "$status" -eq 0 ]; then
            :
          elif [ "$status" -eq 1 ]; then
            echo '::error::external actions and workflows must use an immutable 40-character commit SHA'
            exit 1
          else
            echo "::error::immutable action-reference scan failed with status $status"
            exit 1
          fi
        env:
          ACTION_REF_PATTERN: '^\s*(?:-\s*)?uses:\s+(?!\./)(?![^@[:space:]]+@[0-9a-f]{40}(?:[[:space:]]|$))'
      - name: Install shellcheck
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y shellcheck
      # Download a fixed actionlint release and authenticate the archive before
      # extracting it. Avoid executing a mutable raw.githubusercontent.com script.
      - name: Run actionlint
        shell: bash
        run: |
          set -euo pipefail
          archive=actionlint_1.7.12_linux_amd64.tar.gz
          curl --proto '=https' --tlsv1.2 --retry 5 --retry-all-errors -fsSLO \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.12/$archive"
          printf '%s  %s\n' \
            8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 \
            "$archive" | sha256sum --check --strict
          tar -xzf "$archive" actionlint
          command -v shellcheck >/dev/null || {
            echo '::error::shellcheck is required for actionlint run-block validation'
            exit 1
          }
          ./actionlint -color
