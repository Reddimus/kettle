name: Nix packaging

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nix.yml"
      - ".cargo/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - "flake.lock"
      - "flake.nix"
      - "vendor/**"
  pull_request:
    paths:
      - ".github/workflows/nix.yml"
      - ".cargo/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - "flake.lock"
      - "flake.nix"
      - "vendor/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: flake check and build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a # v21
        with:
          determinate: false
      - name: Evaluate supported systems
        run: nix flake check --all-systems --no-build --no-update-lock-file
      - name: Build and test package
        run: >-
          nix build .#checks.x86_64-linux.cargo-test
          --no-link --no-update-lock-file --print-build-logs
      - name: Launch installed package under Xvfb
        run: >-
          nix build .#checks.x86_64-linux.runtime-smoke
          --no-link --no-update-lock-file --print-build-logs
      - name: Build package
        run: nix build .#packages.x86_64-linux.default --no-link --no-update-lock-file --print-build-logs
