# media-fuzz — nightly, time-boxed fuzzing of what the media worker parses.
#
# The worker reads untrusted bytes: frames, a playback session's stream, a
# video's first bytes, rasters, SVG, Mermaid and Markdown galleries, and the
# external decoder's text. Each has an in-process sweep that runs with every
# test (see docs/TESTING.md); this runs the same entry points under libFuzzer
# (cargo fuzz, on a pinned nightly), starting from the sweeps' own seeds.
#
# - Nightly: each target runs for a quarter of an hour.
# - Dispatch: as long as asked, up to an hour.
# - A pull request that changes the harness: each target runs for a minute,
#   so a broken target is found before it merges.
#
# A target that crashes, leaks, runs out of memory or hangs fails its job
# and keeps its input as an artifact. A failed nightly run opens one issue,
# or comments on the open one. This is separate from ci.yml's per-PR nightly
# job, which only builds and tests.
name: media-fuzz

on:
  schedule:
    - cron: "41 7 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds each target runs (at most 3600)
        required: false
        default: "900"
  pull_request:
    paths:
      - ".github/workflows/media-fuzz.yml"
      - "fuzz/**"
      - "crates/kettle-test-support/src/mutate.rs"
      - "crates/kettle-media/src/fuzzing.rs"
      - "crates/kettle-media-render/src/fuzzing.rs"
      - "crates/kettle-media-native/src/fuzzing.rs"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    # Budget cap: up to twenty minutes of building and seeding, then a run
    # of at most an hour.
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        target: [wire, session, sniff, render, ffprobe]
    env:
      TARGET: ${{ matrix.target }}
      RUN_SECONDS: ${{ github.event_name == 'pull_request' && '60' || inputs.seconds || '900' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # cargo fuzz needs a nightly compiler for its sanitizer flags. Pinned,
      # so a night's result depends on the code, not on that day's nightly.
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: nightly-2026-09-24
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: media-fuzz-${{ matrix.target }}
          workspaces: |
            . -> target
            fuzz -> target
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Check the fuzz lockfile is current
        run: cargo metadata --locked --format-version 1 --manifest-path fuzz/Cargo.toml > /dev/null
      # The sweeps' seeds are the starting corpus: each writes its own when
      # KETTLE_FUZZ_CORPUS names a directory.
      - name: Seed the corpus
        env:
          KETTLE_FUZZ_CORPUS: ${{ github.workspace }}/fuzz/corpus
        run: >-
          cargo test --locked -p kettle-media -p kettle-media-render
          -p kettle-media-native --lib fuzzing
      - name: Fuzz
        shell: bash
        run: |
          set -euo pipefail
          # A dispatch's number, held to an hour so the job outlasts it.
          seconds=900
          if [[ "$RUN_SECONDS" =~ ^[0-9]{1,6}$ ]] && (( 10#$RUN_SECONDS > 0 )); then
            seconds=$(( 10#$RUN_SECONDS < 3600 ? 10#$RUN_SECONDS : 3600 ))
          fi
          dictionary=()
          if [ -f "fuzz/dict/$TARGET.dict" ]; then
            dictionary=("-dict=$GITHUB_WORKSPACE/fuzz/dict/$TARGET.dict")
          fi
          cargo fuzz run "$TARGET" "fuzz/corpus/$TARGET" -- \
            -max_total_time="$seconds" \
            -max_len=262144 \
            -rss_limit_mb=2560 \
            -timeout=30 \
            "${dictionary[@]}"
      - name: Keep the finding
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: media-fuzz-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
          retention-days: 30

  report:
    name: report a failed night
    needs: fuzz
    if: ${{ always() && needs.fuzz.result == 'failure' && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the tracking issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="media-fuzz: a nightly run failed"
          body="The nightly media fuzz run failed: $RUN_URL. A target that found an input that crashes, leaks or hangs keeps it in that run's artifacts; reproduce it with \`cargo fuzz run <target> <input>\` on the workflow's pinned nightly (docs/TESTING.md). A run with no artifact failed to build or seed."
          existing=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
