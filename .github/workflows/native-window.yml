name: One-off grapheme width regressions and hosted Linux strict gate
permissions:
  contents: read
concurrency:
  group: hosted-grapheme-width-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_BUILD_JOBS: '1'
  CARGO_INCREMENTAL: '0'
  RUST_TEST_THREADS: '1'
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  KETTLE_MERMAID_REQUIRED: '1'
  CARGO_TARGET_DIR: ${{ github.workspace }}/product/target
  CARGO_TERM_COLOR: never
jobs:
  strict:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        shell: bash
    steps:
    - name: Checkout isolated carrier only
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        path: carrier
        persist-credentials: false
    - name: Checkout exact product baseline separately
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: c8da69902751c63748f8f3722a6cfa2b7166ea91
        path: product
        persist-credentials: false
    - name: Checkout exact old production separately for tests-only controls
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: c8da69902751c63748f8f3722a6cfa2b7166ea91
        path: old-control
        persist-credentials: false
    - name: Apply complete indexed candidate and old tests-only patch; verify both source trees
      id: apply
      run: |
        set -euo pipefail
        packet="$GITHUB_WORKSPACE/carrier/.github/hosted-grapheme-width-final-r2"
        evidence="$RUNNER_TEMP/hosted-grapheme-width-r2"
        mkdir -m 700 "$evidence"
        printf '%s\n' "21aeb29a437df90a3fea6f9f0b17cbb969f35febe922879dce5b78f0578a607e  $packet/source.patch.gz" | sha256sum --check
        printf '%s\n' "8a4905ed29cc60f8084b652b9615bd9a9ab16e975c23b8436f1a0c0f4fb125e4  $packet/old-tests.patch.gz" | sha256sum --check
        printf '%s\n' "6611b37e75231991c258db5a126446c538f485a044be00fb513eda20fa26affa  $packet/expected-new-files.json" | sha256sum --check
        printf '%s\n' "ee210392f823ff82a1c2355b1f0a8f81a02f17efbc563085ecb418ab45efe778  $packet/expected-old-files.json" | sha256sum --check
        printf '%s\n' "7f1422b4ea917ac25885349b0ed3f3c2271cd123781479f40bf2eec38fc7cefc  $packet/bindingchecker.py" | sha256sum --check
        printf '%s\n' "f55ea8c216075eeb40cb5842772198fc227efea4b79416f4248a9cada1718284  $packet/regressioncheck.py" | sha256sum --check
        gzip -cd "$packet/source.patch.gz" > "$evidence/source.patch"
        gzip -cd "$packet/old-tests.patch.gz" > "$evidence/old-tests.patch"
        printf '%s\n' "acec26478b3f028662d6a8e8dbdfb685feff43f12a86fd553b254e75b139947d  $evidence/source.patch" "ce9668b436ed087200bb72a65e9c1a881acc9ff664dab6da48c45eb2614e63a0  $evidence/old-tests.patch" | sha256sum --check
        git -C product apply --check --index "$evidence/source.patch"
        git -C product apply --index "$evidence/source.patch"
        git -C old-control apply --check "$evidence/old-tests.patch"
        git -C old-control apply "$evidence/old-tests.patch"
        python3 -I -B "$packet/bindingchecker.py" --product product --variant new --row entry --phase entry --evidence "$evidence"
        python3 -I -B "$packet/bindingchecker.py" --product old-control --variant old --row entry --phase entry --evidence "$evidence"
    - name: Stable Rust with required components
      uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
      with:
        toolchain: stable
        components: clippy, rustfmt
    - name: Existing CI Linux dependencies
      timeout-minutes: 5
      working-directory: product
      run: |
        scripts/install-ci-linux-deps.sh pkg-config libfontconfig1-dev libfreetype6-dev \
          libx11-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
          libxcb1-dev mesa-vulkan-drivers libvulkan1 xvfb xauth fonts-dejavu-core fish \
          xclip x11-utils xdotool libxtst6 dbus-daemon ffmpeg weston fontconfig \
          libgl1-mesa-dri libegl-mesa0
    - name: Existing product Rust cache
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      with:
        workspaces: product -> target
        save-if: false
    - name: Install exact strict-gate tools
      uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68
      with:
        tool: just@1.58.0,cargo-deny@0.20.2,cargo-audit@0.22.2,cargo-shear@1.14.0,zizmor@1.31.1,typos@1.51.1,shellcheck@0.11.0,lychee@0.24.2
    - name: Existing Ruff action and exact CLI
      uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89
      with:
        version: 0.16.10
        args: check
        src: product/scripts
    - name: Record OS and tools; require actual Node, npx and Chrome
      run: |
        set -euo pipefail
        evidence="$RUNNER_TEMP/hosted-grapheme-width-r2"
        {
          uname -a
          cat /etc/os-release
          printf 'ImageOS=%s\nImageVersion=%s\nRUNNER_OS=%s\nRUNNER_ARCH=%s\n' "${ImageOS:-}" "${ImageVersion:-}" "$RUNNER_OS" "$RUNNER_ARCH"
          git --version
          python3 --version
          rustc --version --verbose
          cargo --version
          cargo clippy --version
          cargo fmt --version
          just --version
          cargo deny --version
          cargo audit --version
          cargo shear --version
          zizmor --version
          typos --version
          shellcheck --version
          lychee --version
          ruff --version
          node --version
          npm --version
          npx --version
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$chrome"
          printf 'Chrome executable: %s\n' "$chrome"
          "$chrome" --version
          printf 'PUPPETEER_EXECUTABLE_PATH=%s\n' "$chrome" >> "$GITHUB_ENV"
        } > "$evidence/os-tools.txt" 2>&1
        cat "$evidence/os-tools.txt"
        python3 -I -B -c 'import json,os,sys; from pathlib import Path; names=("GITHUB_REPOSITORY","GITHUB_SHA","GITHUB_REF","GITHUB_RUN_ID","GITHUB_RUN_ATTEMPT","GITHUB_WORKFLOW","RUNNER_OS","RUNNER_ARCH","ImageOS","ImageVersion"); Path(sys.argv[1]).write_text(json.dumps({key:os.environ.get(key) for key in names},indent=2)+"\n")' "$evidence/run-metadata.json"
    - name: Prefetch locked workspace, vendor and fuzz dependencies online
      timeout-minutes: 15
      working-directory: product
      env:
        CARGO_NET_OFFLINE: 'false'
      run: |
        set -euo pipefail
        nice -n 10 cargo fetch --locked
        nice -n 10 cargo fetch --locked --manifest-path vendor/Cargo.toml
        nice -n 10 cargo fetch --locked --manifest-path fuzz/Cargo.toml
    - name: Three exact old-production assertion controls; reject setup and zero-test failures
      id: old_controls
      timeout-minutes: 45
      env:
        CARGO_NET_OFFLINE: 'true'
        CARGO_TARGET_DIR: ${{ github.workspace }}/old-control/target
      run: |
        set -euo pipefail
        packet="$GITHUB_WORKSPACE/carrier/.github/hosted-grapheme-width-final-r2"
        evidence="$RUNNER_TEMP/hosted-grapheme-width-r2"
        check_both() {
          python3 -I -B "$packet/bindingchecker.py" --product "$GITHUB_WORKSPACE/product" --variant new --row "$1" --phase "$2" --evidence "$evidence"
          python3 -I -B "$packet/bindingchecker.py" --product "$GITHUB_WORKSPACE/old-control" --variant old --row "$1" --phase "$2" --evidence "$evidence"
        }
        run_and_drain() {
          label="$1"
          shift
          export CAPTURE_ROOT="$evidence/$label"
          mkdir -m 700 "$CAPTURE_ROOT"
          started="$(date +%s%N)"
          set +e
          nice -n 10 "$@" 2>&1 | python3 -I -B -c '
        import hashlib
        import json
        import os
        import sys
        import time
        from pathlib import Path
        root=Path(os.environ["CAPTURE_ROOT"])
        limit=16*1024*1024
        total=kept=echoed=0
        live_limit=64*1024
        digest=hashlib.sha256()
        with (root/"strict.log").open("xb") as output:
            while True:
                data=os.read(sys.stdin.fileno(),65536)
                if not data:
                    break
                total+=len(data)
                digest.update(data)
                retained=data[:max(0,limit-kept)]
                output.write(retained)
                output.flush()
                kept+=len(retained)
                progress=json.dumps({"strict_log_bytes":total,"last_chunk_bytes":len(data),"wall_ns":time.time_ns()},sort_keys=True)+"\n"
                progress_bytes=len(progress.encode("ascii"))
                if echoed+progress_bytes<=live_limit:
                    sys.stdout.write(progress)
                    sys.stdout.flush()
                    echoed+=progress_bytes
        record={"bytes":total,"retained_bytes":kept,"sha256_all_drained_bytes":digest.hexdigest(),"limit":limit,"over_limit":total>limit,"pipe_eof":True,"drained_wall_ns":time.time_ns(),"live_echo_bytes":echoed,"live_echo_limit":live_limit}
        (root/"strict-log.json").write_text(json.dumps(record,indent=2)+"\n")
        print(json.dumps(record,sort_keys=True))
        raise SystemExit(2 if total>limit else 0)
        '
          statuses=("${PIPESTATUS[@]}")
          set -e
          finished="$(date +%s%N)"
          python3 -I -B -c 'import json,os,sys;from pathlib import Path;Path(sys.argv[1]).write_text(json.dumps({"scope":"HOSTED_RUST_TEST_ONLY_NOT_NATIVE_RELEASE","command_exit":int(sys.argv[2]),"drain_exit":int(sys.argv[3]),"started_wall_ns":int(sys.argv[4]),"finished_wall_ns":int(sys.argv[5]),"argv":["nice","-n","10",*sys.argv[6:]],"cargo_target_dir":os.environ["CARGO_TARGET_DIR"],"cargo_incremental":os.environ["CARGO_INCREMENTAL"],"jobs":os.environ["CARGO_BUILD_JOBS"],"cargo_net_offline":os.environ["CARGO_NET_OFFLINE"]},indent=2)+"\n")' "$CAPTURE_ROOT/command-exit.json" "${statuses[0]}" "${statuses[1]}" "$started" "$finished" "$@"
        }
        for case in virama singletons retention; do
          case "$case" in
            virama) filter=term::grapheme_width_tests::grapheme_final_viramas_keep_all_32_measured_syllables_narrow ;;
            singletons) filter=term::grapheme_width_tests::grapheme_final_singletons_take_one_cell_and_keep_scalar_mode_unchanged ;;
            retention) filter=term::grapheme_width_tests::grapheme_saturated_prefix_preserves_the_first_base_and_later_presentation ;;
          esac
          label="old-$case"
          check_both "$label" before
          run_and_drain "$label" cargo test --locked --offline --manifest-path "$GITHUB_WORKSPACE/old-control/vendor/Cargo.toml" -p alacritty_terminal --lib "$filter" -- --exact
          check_both "$label" after
          python3 -I -B "$packet/regressioncheck.py" --root "$CAPTURE_ROOT" --exit "${statuses[0]}" --drain-exit "${statuses[1]}" --expect red --name "$filter"
        done
    - name: New vendor and core grapheme GREEN plus exact unchanged replay test
      id: new_focused
      timeout-minutes: 45
      working-directory: product
      env:
        CARGO_NET_OFFLINE: 'true'
      run: |
        set -euo pipefail
        packet="$GITHUB_WORKSPACE/carrier/.github/hosted-grapheme-width-final-r2"
        evidence="$RUNNER_TEMP/hosted-grapheme-width-r2"
        check_both() {
          python3 -I -B "$packet/bindingchecker.py" --product "$GITHUB_WORKSPACE/product" --variant new --row "$1" --phase "$2" --evidence "$evidence"
          python3 -I -B "$packet/bindingchecker.py" --product "$GITHUB_WORKSPACE/old-control" --variant old --row "$1" --phase "$2" --evidence "$evidence"
        }
        run_and_drain() {
          label="$1"
          shift
          export CAPTURE_ROOT="$evidence/$label"
          mkdir -m 700 "$CAPTURE_ROOT"
          started="$(date +%s%N)"
          set +e
          nice -n 10 "$@" 2>&1 | python3 -I -B -c '
        import hashlib
        import json
        import os
        import sys
        import time
        from pathlib import Path
        root=Path(os.environ["CAPTURE_ROOT"])
        limit=16*1024*1024
        total=kept=echoed=0
        live_limit=64*1024
        digest=hashlib.sha256()
        with (root/"strict.log").open("xb") as output:
            while True:
                data=os.read(sys.stdin.fileno(),65536)
                if not data:
                    break
                total+=len(data)
                digest.update(data)
                retained=data[:max(0,limit-kept)]
                output.write(retained)
                output.flush()
                kept+=len(retained)
                progress=json.dumps({"strict_log_bytes":total,"last_chunk_bytes":len(data),"wall_ns":time.time_ns()},sort_keys=True)+"\n"
                progress_bytes=len(progress.encode("ascii"))
                if echoed+progress_bytes<=live_limit:
                    sys.stdout.write(progress)
                    sys.stdout.flush()
                    echoed+=progress_bytes
        record={"bytes":total,"retained_bytes":kept,"sha256_all_drained_bytes":digest.hexdigest(),"limit":limit,"over_limit":total>limit,"pipe_eof":True,"drained_wall_ns":time.time_ns(),"live_echo_bytes":echoed,"live_echo_limit":live_limit}
        (root/"strict-log.json").write_text(json.dumps(record,indent=2)+"\n")
        print(json.dumps(record,sort_keys=True))
        raise SystemExit(2 if total>limit else 0)
        '
          statuses=("${PIPESTATUS[@]}")
          set -e
          finished="$(date +%s%N)"
          python3 -I -B -c 'import json,os,sys;from pathlib import Path;Path(sys.argv[1]).write_text(json.dumps({"scope":"HOSTED_RUST_TEST_ONLY_NOT_NATIVE_RELEASE","command_exit":int(sys.argv[2]),"drain_exit":int(sys.argv[3]),"started_wall_ns":int(sys.argv[4]),"finished_wall_ns":int(sys.argv[5]),"argv":["nice","-n","10",*sys.argv[6:]],"cargo_target_dir":os.environ["CARGO_TARGET_DIR"],"cargo_incremental":os.environ["CARGO_INCREMENTAL"],"jobs":os.environ["CARGO_BUILD_JOBS"],"cargo_net_offline":os.environ["CARGO_NET_OFFLINE"]},indent=2)+"\n")' "$CAPTURE_ROOT/command-exit.json" "${statuses[0]}" "${statuses[1]}" "$started" "$finished" "$@"
        }
        for case in vendor core replay; do
          label="new-$case"
          check_both "$label" before
          case "$case" in
            vendor)
              run_and_drain "$label" cargo test --locked --offline --manifest-path vendor/Cargo.toml -p alacritty_terminal
              names=(--name term::grapheme_width_tests::grapheme_final_viramas_keep_all_32_measured_syllables_narrow --name term::grapheme_width_tests::grapheme_final_singletons_take_one_cell_and_keep_scalar_mode_unchanged --name term::grapheme_width_tests::grapheme_saturated_prefix_preserves_the_first_base_and_later_presentation --name term::grapheme::tests::mode_on_scalar_contributions_and_shaping_bases_stay_distinct)
              ;;
            core)
              run_and_drain "$label" cargo test --locked --offline -p kettle-core grapheme_
              names=(--name term::conformance::grapheme_saturated_positive_prefix_keeps_base_selection_search_and_resets)
              ;;
            replay)
              filter=term::conformance::replays_asciicast_v2_output_into_grid
              run_and_drain "$label" cargo test --locked --offline -p kettle-core --lib "$filter" -- --exact
              names=(--name "$filter" --exact-one)
              ;;
          esac
          check_both "$label" after
          python3 -I -B "$packet/regressioncheck.py" --root "$CAPTURE_ROOT" --exit "${statuses[0]}" --drain-exit "${statuses[1]}" --expect green "${names[@]}"
        done
    - name: Fresh exact-source and 8 GiB check immediately before product gate
      run: |
        set -euo pipefail
        python3 -I -B "$GITHUB_WORKSPACE/carrier/.github/hosted-grapheme-width-final-r2/bindingchecker.py" --product product --variant new --row strict --phase before --evidence "$RUNNER_TEMP/hosted-grapheme-width-r2"
        python3 -I -B "$GITHUB_WORKSPACE/carrier/.github/hosted-grapheme-width-final-r2/bindingchecker.py" --product old-control --variant old --row strict --phase before --evidence "$RUNNER_TEMP/hosted-grapheme-width-r2"
    - name: Actual hosted Linux strict gate with bounded evidence log
      id: strict
      timeout-minutes: 90
      working-directory: product
      env:
        CARGO_NET_OFFLINE: 'true'
      run: |
        set -euo pipefail
        export CAPTURE_ROOT="$RUNNER_TEMP/hosted-grapheme-width-r2/strict"
        mkdir -m 700 "$CAPTURE_ROOT"
        started="$(date +%s%N)"
        set +e
        nice -n 10 just gauntlet-strict 2>&1 | python3 -I -B -c '
        import hashlib
        import json
        import os
        import sys
        import time
        from pathlib import Path
        root=Path(os.environ["CAPTURE_ROOT"])
        limit=16*1024*1024
        total=kept=echoed=0
        live_limit=64*1024
        digest=hashlib.sha256()
        with (root/"strict.log").open("xb") as output:
            while True:
                data=os.read(sys.stdin.fileno(),65536)
                if not data:
                    break
                total+=len(data)
                digest.update(data)
                retained=data[:max(0,limit-kept)]
                output.write(retained)
                output.flush()
                kept+=len(retained)
                progress=json.dumps({"strict_log_bytes":total,"last_chunk_bytes":len(data),"wall_ns":time.time_ns()},sort_keys=True)+"\n"
                progress_bytes=len(progress.encode("ascii"))
                if echoed+progress_bytes<=live_limit:
                    sys.stdout.write(progress)
                    sys.stdout.flush()
                    echoed+=progress_bytes
        record={"bytes":total,"retained_bytes":kept,"sha256_all_drained_bytes":digest.hexdigest(),"limit":limit,"over_limit":total>limit,"pipe_eof":True,"drained_wall_ns":time.time_ns(),"live_echo_bytes":echoed,"live_echo_limit":live_limit}
        (root/"strict-log.json").write_text(json.dumps(record,indent=2)+"\n")
        print(json.dumps(record,sort_keys=True))
        raise SystemExit(2 if total>limit else 0)
        '
        statuses=("${PIPESTATUS[@]}")
        set -e
        finished="$(date +%s%N)"
        python3 -I -B -c 'import json,sys; from pathlib import Path; Path(sys.argv[1]).write_text(json.dumps({"scope":"HOSTED_LINUX_SOURCE_ONLY_NOT_MAC_DELL_OR_RELEASE","strict_exit":int(sys.argv[2]),"log_drain_exit":int(sys.argv[3]),"started_wall_ns":int(sys.argv[4]),"finished_wall_ns":int(sys.argv[5]),"argv":["nice","-n","10","just","gauntlet-strict"],"cargo_net_offline":True,"cargo_incremental":"0","jobs":1},indent=2)+"\n")' \
          "$CAPTURE_ROOT/strict-exit.json" "${statuses[0]}" "${statuses[1]}" "$started" "$finished"
        if (( statuses[0] != 0 )); then exit "${statuses[0]}"; fi
        if (( statuses[1] != 0 )); then exit "${statuses[1]}"; fi
    - name: Strict row source post-bookends
      if: ${{ always() && steps.strict.outcome != 'skipped' && steps.apply.outcome == 'success' }}
      run: |
        python3 -I -B "$GITHUB_WORKSPACE/carrier/.github/hosted-grapheme-width-final-r2/bindingchecker.py" --product product --variant new --row strict --phase after --evidence "$RUNNER_TEMP/hosted-grapheme-width-r2"
        python3 -I -B "$GITHUB_WORKSPACE/carrier/.github/hosted-grapheme-width-final-r2/bindingchecker.py" --product old-control --variant old --row strict --phase after --evidence "$RUNNER_TEMP/hosted-grapheme-width-r2"
    - name: Verify all exact source bytes and modes after the attempted gate
      if: ${{ always() && steps.apply.outcome == 'success' }}
      run: |
        set -euo pipefail
        python3 -I -B "$GITHUB_WORKSPACE/carrier/.github/hosted-grapheme-width-final-r2/bindingchecker.py" --product product --variant new --row final --phase after --evidence "$RUNNER_TEMP/hosted-grapheme-width-r2"
        python3 -I -B "$GITHUB_WORKSPACE/carrier/.github/hosted-grapheme-width-final-r2/bindingchecker.py" --product old-control --variant old --row final --phase after --evidence "$RUNNER_TEMP/hosted-grapheme-width-r2"
    - name: Retain bounded gate evidence and exact carrier inputs
      if: ${{ always() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: hosted-grapheme-width-r2-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          ${{ runner.temp }}/hosted-grapheme-width-r2
          carrier/.github/hosted-grapheme-width-final-r2
          carrier/.github/workflows/native-window.yml
        if-no-files-found: error
        retention-days: 7
'on':
  workflow_dispatch: null
