name: Bug report
description: A reproducible bug in kettle (crash, wrong rendering, broken keybind, …)
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Filling in the fields below lets a
        maintainer reproduce the bug quickly and turn it into a cycle
        (see [CONTRIBUTING.md](../CONTRIBUTING.md)).

  - type: input
    id: version
    attributes:
      label: kettle version
      description: Output of `kettle --version` (includes the git SHA on git checkouts).
      placeholder: "kettle 1.3.7 (5b74b32d3c95)"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      multiple: false
      options:
        - Linux (X11)
        - Linux (Wayland)
        - macOS
        - Windows 11
        - Windows 10
        - Other (specify in the description)
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: OS version / distro
      placeholder: "Ubuntu 24.04, macOS 14.5, Windows 11 23H2, …"
    validations:
      required: false

  - type: textarea
    id: gpu-info
    attributes:
      label: GPU / wgpu adapter info
      description: |
        Output of `kettle --gpu-info`. Paste the whole block — the
        adapter / backend / driver / texture-limit lines are exactly
        the diagnostic we need when triaging a rendering / blank-
        window / "no GPU adapter" bug. Skip this field for non-
        rendering bugs (broken keybind, config parse error, etc.).
      render: shell
    validations:
      required: false

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: A minimal recipe. Paste any escape sequences with `printf '\\e[…'` so we can replay them.
      placeholder: |
        1. Launch kettle
        2. Run `printf '\e[?1049h'` in the shell
        3. …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Screenshots welcome — drag image files into this box.
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: Log output
      description: |
        Re-run kettle with `RUST_LOG=info` (or `debug`) and paste the
        relevant lines from stderr.
      render: shell

  - type: textarea
    id: config
    attributes:
      label: Relevant config
      description: |
        Output of `kettle --check-config` — or just the lines from
        `~/.config/kettle/config` that you think matter.
      render: ini

  - type: checkboxes
    id: checked
    attributes:
      label: Confirmations
      options:
        - label: I'm on the latest released version, or the bug reproduces on `main`.
          required: true
        - label: I searched existing issues and didn't find a duplicate.
          required: true
