[package]
name = "kettle-media-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "The media worker's renderer for kettle: bounded, safe-code decoding of one job"
publish = false

[lints]
workspace = true

[dependencies]
kettle-media.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
# The raster codecs a job may hold. A build that links in more (arboard adds
# TIFF to a workspace build) changes nothing: the renderer names the formats
# it decodes and refuses the rest.
# TIFF is decoded by the pure-Rust `tiff` crate, which the lock already holds.
image = { workspace = true, features = ["png", "jpeg", "webp", "bmp", "gif", "tiff"] }
# O_NONBLOCK and O_NOCTTY for the source open; no unsafe call is made.
libc = "0.2"
# A cached thumbnail's text chunks, read before its pixels are decoded: the
# PNG decoder the raster codecs already use.
png = "0.18.1"
# SVG, pinned exactly: admission mirrors this renderer's allocation geometry,
# so a version change needs that audit. Defaults off: no system font
# discovery, memory-mapped fonts, compressed SVG or embedded raster images;
# text shapes with the fonts the job names only.
resvg = { version = "=0.48.1", default-features = false, features = ["text"] }
usvg = { version = "=0.48.1", default-features = false, features = ["text"] }
# Parses SVG for sanitizing before usvg sees it, and writes the result back.
roxmltree = "=0.21.1"
xmlwriter = "=0.1.0"
# Read just the selected font face with the same maintained parser usvg
# uses, without fontdb's all-face collection/name loader.
skrifa = "=0.46.2"
unicode-script = "=0.5.8"
unicode-segmentation.workspace = true
unicode-linebreak = "=0.1.5"
# The pinned SVG engine's selector dialect, used only for generated diagrams.
simplecss = "=0.2.2"
# Mermaid: parsing, layout and SVG, without its own text measurement (Kettle
# measures with the job's fonts) or any network or file access.
merman = { version = "=0.8.0", default-features = false, features = ["svg", "layout-cytoscape", "all-diagrams"] }
# Exact transitive family constraints keep parsing, layout and painting coherent.
merman-core = { version = "=0.8.0", default-features = false }
merman-render = { version = "=0.8.0", default-features = false }
dugong = { version = "=0.9.2", default-features = false }
dugong-graphlib = { version = "=0.8.0", default-features = false }
manatee = { version = "=0.8.0", default-features = false }
roughr-merman = { version = "=0.12.3", default-features = false }
# CommonMark, for the Mermaid fences in a Markdown gallery: the version
# merman-render already locks, with no HTML writer or command line.
pulldown-cmark = { version = "=0.13.4", default-features = false }
# PDF pages, pinned exactly with its parser and interpreter: a young renderer
# whose bounds a version change must be checked against again, used only in a
# confined worker (see `pdf`). Its own crates forbid unsafe code; it pulls in
# zlib-rs and SIMD rasterizing that do not. Defaults off: no SIMD image
# scaler. The fonts and CMaps the PDF standard requires are embedded, so
# nothing is read from the system. hayro-syntax is the patched local copy.
hayro = { version = "=0.8.0", default-features = false, features = ["embed-fonts", "embed-cmaps"] }
hayro-interpret = { version = "=0.8.0", default-features = false }
hayro-syntax = { version = "=0.8.0", default-features = false }

[package.metadata.cargo-machete]
# These dependencies constrain the renderer family rather than expose APIs.
ignored = ["merman-core", "merman-render", "dugong", "dugong-graphlib", "manatee", "roughr-merman", "hayro-interpret", "hayro-syntax"]

[features]
# The entry point the fuzz targets (fuzz/) call. Never in a shipped build.
fuzzing = []

[dev-dependencies]
toml.workspace = true
# APNG fixtures for the animation path, at the version image already locks.
png = "=0.18.1"
kettle-test-support.workspace = true
tempfile = "3"
