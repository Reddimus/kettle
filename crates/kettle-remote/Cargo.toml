[package]
name = "kettle-remote"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# Isolated from kettle-core (per TERMINATOR-REMOTE-DESIGN.md) so the
# sysinfo dep doesn't propagate to non-UI consumers (the headless
# --screenshot path, the --check-config validator).
description = "kettle: SSH / Docker / Podman / kubectl remote-session detection for the focused pane"

[lints]
workspace = true

[dependencies]
# Cross-platform process-tree walking (per
# TERMINATOR-REMOTE-DESIGN.md). sysinfo handles
# /proc on Linux, libproc on macOS, NtQuerySystemInformation on
# Windows behind a single Rust API. Isolated to this crate so
# the dep doesn't propagate to non-UI consumers (the headless
# --screenshot path, --check-config validator).
#
# Default features turn on a lot of unused refreshers (disk, net,
# components). We only need process enumeration; opt-out + opt-in
# the bare minimum.
sysinfo = { version = "0.32", default-features = false, features = ["system"] }

# libproc and sysctl for the pane-rooted macOS process walk in src/macos.rs.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[dev-dependencies]
kettle-test-support.workspace = true
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "scan"
harness = false
