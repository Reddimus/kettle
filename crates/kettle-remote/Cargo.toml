[package]
name = "kettle-remote"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# Keep process-scanning dependencies out of kettle-core.
description = "kettle: SSH / Docker / Podman / kubectl remote-session detection for the focused pane"

[lints]
workspace = true

[dependencies]
# sysinfo supplies the portable full-snapshot API and Windows scanning; Linux/macOS UI scans
# use pane-rooted native walks.
#
# Default features turn on a lot of unused refreshers (disk, net,
# components). We only need process enumeration; opt-out + opt-in
# the bare minimum.
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }

# libproc and sysctl for the pane-rooted macOS process walk in src/macos.rs.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[dev-dependencies]
kettle-test-support.workspace = true
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "scan"
harness = false
