[package]
name = "kettle-remote"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# Cycle 643 (sub-cycle 2 of TERMINATOR-REMOTE-DESIGN.md): isolated
# from kettle-core so the eventual sysinfo dep doesn't propagate
# to non-UI consumers (the headless --screenshot path, the
# --check-config validator). This sub-cycle ships the
# RemoteContext type + a no-op detect() stub; the actual sysinfo
# walk lands in sub-cycle 3+.
description = "kettle: SSH / Docker / Podman / kubectl remote-session detection for the focused pane"

[lints]
workspace = true

[dependencies]
# Cycle 737: removed `log` workspace dep. cargo-machete on Win11
# (Surface Book 3, 2026-05-23) flagged it as unused — kettle-remote
# has no `log::` calls anywhere in src/. The dep was declared at
# crate-creation (cycle 643) for the eventual remote-detection
# diagnostic logging path that never materialized (the actual
# diagnostics live in kettle-ui's per-pane state log). cargo-machete
# CI hadn't caught this pre-737 because the `.github/workflows/
# machete.yml` workflow only fires on Cargo.{toml,lock} changes,
# and kettle-remote/Cargo.toml hadn't been touched since cycle 718;
# cycle 730's ProcessTree refactor was purely src/ — no manifest
# change → no machete re-run.
# Cycle 646 (sub-cycle 5 of TERMINATOR-REMOTE-DESIGN.md): cross-
# platform process-tree walking. sysinfo handles
# /proc on Linux, libproc on macOS, NtQuerySystemInformation on
# Windows behind a single Rust API. Isolated to this crate so
# the dep doesn't propagate to non-UI consumers (the headless
# --screenshot path, --check-config validator).
#
# Default features turn on a lot of unused refreshers (disk, net,
# components). We only need process enumeration; opt-out + opt-in
# the bare minimum.
sysinfo = { version = "0.32", default-features = false, features = ["system"] }
