[package]
name = "kettle-update"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Signed release-feed verification and transactional self-update support for kettle"

[lints]
workspace = true

[dependencies]
# default-features = false drops 0.23's new default-on `simd-unsafe` feature:
# hand-written core::arch AVX2/NEON kernels for both encode and decode. Kettle
# only ever uses the scalar `general_purpose::STANDARD` engine, so the SIMD
# engines are inert here — but this crate decodes the Ed25519 release signature,
# and leaving the feature on would compile unsafe code onto a verification
# boundary for no benefit. Without it base64 enforces #![forbid(unsafe_code)].
base64 = { version = "0.23", default-features = false, features = ["alloc"] }
ed25519-dalek = { version = "3", default-features = false, features = ["fast"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
fs4 = "1.1"
hex = "0.4"
kettle-state.workspace = true
log.workspace = true
semver = "1"
serde = { workspace = true, features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tar = "0.4"
tempfile = "3"
thiserror.workspace = true
ureq = { version = "2", default-features = false, features = ["tls"] }
zip = { version = "8.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_SystemInformation",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# `winresource` is consumed by build.rs rather than a src target, which is
# outside cargo-machete's dependency scan.
[package.metadata.cargo-machete]
ignored = ["winresource"]

[dev-dependencies]
kettle-test-support.workspace = true
