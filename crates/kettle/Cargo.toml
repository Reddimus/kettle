[package]
name = "kettle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
authors.workspace = true
description.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
clap = { version = "4.6.1", features = ["derive"] }
# Cycle 237: bash/zsh/fish/elvish/powershell completion scripts
# emitted by `kettle --print-completions <shell>`. clap_complete
# tracks clap itself so the MSRV constraints are aligned.
clap_complete = "4.6"
env_logger.workspace = true
kettle-config.workspace = true
kettle-render.workspace = true
kettle-ui.workspace = true
log.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Cycle 740: hide the phantom console on GUI launch WITHOUT the
# `windows_subsystem = "windows"` + AttachConsole approach (cycle
# 734, since abandoned — it dropped stdout when launched from a
# shell and flashed a console on GUI launch). kettle stays on the
# DEFAULT console subsystem (so CLI flags `--version` / `--list-
# themes` / `--gpu-info` print to a parent shell for free), and in
# `fn main()` calls `GetConsoleProcessList(1)`: if the count is 1
# (no parent shell — Explorer/Start-menu launch allocated the
# console for us) it hides it via `ShowWindow(GetConsoleWindow(),
# SW_HIDE)`; with a parent shell attached (count > 1) the console
# stays visible. See `crates/kettle/src/main.rs` (~line 435).
#
# windows-sys is a transitive dep already (wgpu / winit / sysinfo
# all pull it), so this is a near-zero binary-size cost.
# `Win32_System_Console` provides GetConsoleProcessList/Window;
# `Win32_UI_WindowsAndMessaging` provides ShowWindow/SW_HIDE.
windows-sys = { version = "0.61", features = [
    "Win32_System_Console",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
] }

[target.'cfg(windows)'.build-dependencies]
# Embed packaging/windows/kettle.ico into the .exe so Explorer, the
# taskbar, Alt-Tab, and the Start menu all show the kettle icon
# instead of the generic Rust .exe glyph. winresource is the
# maintained fork of `winres` (which is unmaintained as of 2024).
winresource = "0.1"

# Cycle 287: `winresource` is a Windows-only build-dependency used
# from `build.rs` (not from any `src/` file), so cargo-machete
# (which only scans `src/`) flags it as unused. The `package.metadata`
# section is the standard escape hatch for known false positives.
# The flag must include `winresource` only — every other dep on this
# crate is genuinely imported in source.
[package.metadata.cargo-machete]
ignored = ["winresource"]
