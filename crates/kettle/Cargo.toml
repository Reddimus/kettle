[package]
name = "kettle"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
clap = { version = "4.6.1", features = ["derive"] }
env_logger.workspace = true
kettle-config = { version = "1.0.1", path = "../kettle-config" }
kettle-render = { version = "1.0.1", path = "../kettle-render" }
kettle-ui = { version = "1.0.1", path = "../kettle-ui" }
log.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.build-dependencies]
# Embed packaging/windows/kettle.ico into the .exe so Explorer, the
# taskbar, Alt-Tab, and the Start menu all show the kettle icon
# instead of the generic Rust .exe glyph. winresource is the
# maintained fork of `winres` (which is unmaintained as of 2024).
winresource = "0.1"
