[package]
name = "kettle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
authors.workspace = true
description.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
clap = { version = "4.6.1", features = ["derive"] }
# Cycle 237: bash/zsh/fish/elvish/powershell completion scripts
# emitted by `kettle --print-completions <shell>`. clap_complete
# tracks clap itself so the MSRV constraints are aligned.
clap_complete = "4.6"
env_logger.workspace = true
kettle-config.workspace = true
kettle-render.workspace = true
kettle-ui.workspace = true
log.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Cycle 734: AttachConsole(ATTACH_PARENT_PROCESS) — re-attaches the
# process's stdout/stderr to a parent console (PowerShell / cmd /
# Git Bash) when kettle.exe is launched from a shell, so CLI flags
# (--version, --list-themes, --gpu-info, …) still print to the
# calling terminal. Paired with the crate-level `#![cfg_attr(
# windows, windows_subsystem = "windows")]` in src/main.rs, which
# tells the linker NOT to allocate a phantom console window on
# Explorer/Start menu launch.
#
# windows-sys is a transitive dep already (wgpu / winit / sysinfo
# all pull it), so this is a near-zero binary-size cost. The
# `Win32_System_Console` feature is the only one needed.
windows-sys = { version = "0.59", features = [
    "Win32_System_Console",
    "Win32_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
] }

[target.'cfg(windows)'.build-dependencies]
# Embed packaging/windows/kettle.ico into the .exe so Explorer, the
# taskbar, Alt-Tab, and the Start menu all show the kettle icon
# instead of the generic Rust .exe glyph. winresource is the
# maintained fork of `winres` (which is unmaintained as of 2024).
winresource = "0.1"

# Cycle 287: `winresource` is a Windows-only build-dependency used
# from `build.rs` (not from any `src/` file), so cargo-machete
# (which only scans `src/`) flags it as unused. The `package.metadata`
# section is the standard escape hatch for known false positives.
# The flag must include `winresource` only — every other dep on this
# crate is genuinely imported in source.
[package.metadata.cargo-machete]
ignored = ["winresource"]
