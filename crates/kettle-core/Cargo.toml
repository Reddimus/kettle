[package]
name = "kettle-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# See `kettle-config/Cargo.toml` for the cycle-218 per-crate-description rationale.
description = "kettle: PTY + alacritty_terminal VT glue, scrollback search, hyperlink/URL/path/IP detection, kitty/Sixel/iTerm2 image registries"

[dependencies]
alacritty_terminal = "0.26.0"
anyhow.workspace = true
crossbeam-channel = "0.5.15"
kettle-vt = { version = "0.1.0", path = "../kettle-vt" }
log.workspace = true
portable-pty = "0.9.0"
regex.workspace = true
serde = { workspace = true, features = ["derive"] }
thiserror.workspace = true
unicode-width.workspace = true
