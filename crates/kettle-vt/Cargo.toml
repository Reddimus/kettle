[package]
name = "kettle-vt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# See `kettle-config/Cargo.toml` for the cycle-218 per-crate-description rationale.
description = "kettle: streaming VT byte extractor — kitty/Sixel/iTerm2 image protocols, OSC 7 cwd, OSC 133 prompt marks, OSC 1→2 title rewrite"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
base64 = "0.22.1"
flate2 = "1.1.9"
# Cycle 277: narrow features to the formats iTerm2's inline-image
# protocol spec actually accepts (PNG, JPEG, GIF). Default features
# pull in EVERY image format the `image` crate supports — avif via
# `rav1e` (~1.6 MB!), exr, webp, tiff, hdr, qoi, dds, ico, etc. —
# none of which kettle's inline-image path ever decodes. Cuts ~3 MB
# off the release binary.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif"] }
log.workspace = true
serde = { workspace = true, features = ["derive"] }
thiserror.workspace = true
