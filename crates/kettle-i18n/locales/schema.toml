context = "crates/kettle-ui/src/media/external/video.rs: right-click menu row on an inline media card, and the media lane button's accessible name, macOS only, that opens a private copy of a shown video in Apple's QuickTime Player. 'QuickTime Player' is the app's name and is the same in Spanish macOS."

[messages.menu_open_in_mpv]
context = "crates/kettle-ui/src/media/external/video.rs: right-click menu row on an inline media card, and the media lane button's accessible name, Linux only, that opens a private copy of a shown video in the mpv video player. 'mpv' is the program's name, lowercase."

[messages.notify_title_open_image]
context = "crates/kettle-ui/src/app.rs act_on_media: desktop notification title when opening a copy of a media item in the image viewer did not work."

[messages.notify_title_open_video]
context = "crates/kettle-ui/src/app.rs open_item_outside: desktop notification title when opening a private copy of a shown video in the permitted video player did not work. 'kettle' is the product name, lowercase as in the other notification titles."

[messages.notify_body_open_video_busy]
context = "crates/kettle-ui/src/app.rs open_item_outside: body when two opens are already under way, or Kettle's store of video copies is full of copies made in the last five minutes."

[messages.notify_body_open_video_copy]
context = "crates/kettle-ui/src/app.rs open_item_outside: body when the private copy of the video could not be made, or was changed before the player got it."

[messages.notify_body_open_video_player]
context = "crates/kettle-ui/src/app.rs open_item_outside: body when the permitted video player (QuickTime Player on macOS, mpv on Linux) is missing or failed its check."

[messages.notify_body_open_video_unplayable]
context = "crates/kettle-ui/src/app.rs open_item_outside: body when the permitted video player does not play the video's container or codec. The poster is the still frame Kettle shows for the video."

[messages.notify_body_open_video_changed]
context = "crates/kettle-ui/src/app.rs open_item_outside: body when the video's file was changed, moved or replaced after Kettle showed it, so Kettle does not copy it. Showing it again renders the current file."

[messages.notify_body_open_video_room]
context = "crates/kettle-ui/src/app.rs open_item_outside: body when the video is larger than the 4 GiB Kettle copies, or copying it would leave less than 2 GiB free on the disk. GiB is the binary unit; keep the numbers."

[messages.notify_body_open_video_refused]
context = "crates/kettle-ui/src/media/external/video.rs open: body when the video player started but exited with an error instead of opening the copy, for example because its build lacks the codec or it cannot reach the display."

[messages.notify_title_preview_failed]
context = "crates/kettle-ui/src/app.rs notify_preview_failure: title of the desktop notification when a preview the user asked for (from a file a pane's output names) could not be shown. 'kettle' is the product name, lowercase as in the other notification titles."

[messages.notify_body_preview_missing]
context = "crates/kettle-ui/src/app.rs notify_preview_failure: body when the file a preview was asked for does not exist: it was removed, or the path names no file from the folder Kettle resolved it against."

[messages.notify_body_preview_unreadable]
context = "crates/kettle-ui/src/app.rs notify_preview_failure: body when Kettle could not read the file: not a regular file (a directory or device), no permission, or it changed during the read."

[messages.notify_body_preview_too_large]
context = "crates/kettle-ui/src/app.rs notify_preview_failure: body when the file is over Kettle's preview size limit."

[messages.notify_body_preview_unsupported]
context = "crates/kettle-ui/src/app.rs notify_preview_failure: body when the file is not an image, an SVG or a Mermaid diagram Kettle can render. 'Mermaid' and 'SVG' are names."

[messages.notify_body_preview_unavailable]
context = "crates/kettle-ui/src/app.rs notify_preview_failure: body when Kettle's media worker, which renders previews in a separate process, is not available."

[messages.notify_body_preview_needs_decoder]
context = "crates/kettle-ui/src/app.rs notify_preview_failure: body when a video could not be previewed because no decoder on this computer reads its format or codec. ffmpeg is a program name; brew install ffmpeg is a command typed exactly. Kettle never installs it."

[messages.notify_body_preview_failed]
context = "crates/kettle-ui/src/app.rs notify_preview_failure: body for any other failure: the render timed out, needed too much memory, or Kettle was rendering something else."

[messages.notify_body_preview_unplaced]
context = "crates/kettle-ui/src/app.rs act_hint: body, under notify_title_preview_failed, when a path picked for a preview cannot be placed on this computer: the pane's folder is unknown or not local, or the path climbs with '..'."

[messages.notify_title_preview_nothing]
context = "crates/kettle-ui/src/app.rs handle_action PreviewLink: title of the desktop notification when the focused pane names no file to preview. 'kettle' is the product name, lowercase as in the other notification titles."

[messages.notify_body_preview_nothing]
context = "crates/kettle-ui/src/app.rs handle_action PreviewLink: body when the focused pane's visible text names no image, SVG or Mermaid file. Quick select finds a path only with a folder in it; './plot.png' is a literal example path and stays as is."

[messages.notify_body_preview_nothing_copied]
context = "crates/kettle-ui/src/app.rs preview_copied_file: body, under notify_title_preview_nothing, when the clipboard names no image, SVG or Mermaid file. 'file://' is a literal URL scheme and stays as is."

[messages.notify_body_preview_no_diagram]
context = "crates/kettle-ui/src/app.rs preview_copied_diagram: body, under notify_title_preview_nothing, when the copied or selected text holds no Mermaid diagram: no ```mermaid fence and no row a diagram starts with (flowchart, sequenceDiagram and so on)."

[messages.notify_body_preview_diagram_wrapped]
context = "crates/kettle-ui/src/app.rs preview_copied_diagram: body, under notify_title_preview_nothing, when a selected or copied diagram's rows were hard-wrapped by the agent's terminal UI and Kettle cannot tell for sure where its lines end. '/copy' is the literal command in Claude Code and Codex that copies the exact block, and stays as is."

[messages.notify_body_preview_diagram_unbounded]
context = "crates/kettle-ui/src/app.rs preview_copied_diagram: body, under notify_title_preview_nothing, when a selected or copied reply holds a diagram whose rows are not indented and more text follows it after a blank row, so Kettle cannot tell whether that text is more of the diagram or the agent's prose."

[messages.notify_body_preview_diagram_too_many]
context = "crates/kettle-ui/src/app.rs preview_copied_diagram: body, under notify_title_preview_nothing, when copied or selected text holds more than count Mermaid diagrams, more than one preview gallery shows, so none is previewed."
args = [{ name = "count", type = "u64" }]

[messages.notify_title_preview_no_room]
context = "crates/kettle-ui/src/app.rs show_media_item: title of the desktop notification when the user opens a pane's preview lane but the pane is too small to hold even its one-row strip beside the terminal. 'kettle' is the product name, lowercase as in the other notification titles."

[messages.notify_body_open_image_busy]
context = "crates/kettle-ui/src/app.rs act_on_media: desktop notification body when too many opens are already running."

[messages.notify_body_open_image_refused]
context = "crates/kettle-ui/src/media/external.rs open: body when the image viewer started but exited with an error instead of opening the PNG copy Kettle made."

[messages.notify_body_open_image_copy]
context = "crates/kettle-ui/src/app.rs act_on_media: desktop notification body when the private PNG copy could not be written, or the item's pixels are no longer held."

[messages.notify_body_open_image_viewer]
context = "crates/kettle-ui/src/app.rs act_on_media: desktop notification body when the permitted image viewer (Preview on macOS, Eye of GNOME on Linux) is missing or failed its check."

