[messages.about_update_available]
context = "crates/kettle-ui/src/app.rs open_about_panel: About panel row. tag is a release tag such as v5.0.0, verbatim."
args = [{ name = "tag", type = "str" }]

[messages.about_update_unknown]
context = "crates/kettle-ui/src/app.rs open_about_panel: About panel row. No update check has finished."

