context = "crates/kettle-ui/src/app.rs open_pane_link: confirmation before opening a local file from a clicked terminal link in a pane running a terminal multiplexer, which may be connected to another machine. name is the file name (at most 25 characters), program is the multiplexer's name (tmux, screen, zellij), never translated. One line with the Cancel and Open buttons in an 80-column window: at most 58 columns with the longest name."
args = [{ name = "name", type = "str" }, { name = "program", type = "str" }]

[messages.confirm_preview_local_file]
context = "crates/kettle-ui/src/app.rs preview_pane_link: confirmation before previewing, in Kettle's preview lane, a local file a pane running a terminal multiplexer names; the multiplexer may be connected to another machine. name is the file name, program is the multiplexer's name (tmux, screen, zellij), never translated. One line with the Cancel and Preview buttons in an 80-column window, leaving the name at least 12 columns."
args = [{ name = "name", type = "str" }, { name = "program", type = "str" }]

[messages.confirm_paste]
context = "crates/kettle-ui/src/app.rs paste_confirm_prompt: confirmation before pasting text that a shell would run line by line."
