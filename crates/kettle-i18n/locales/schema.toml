# Stable message identifiers, argument types and translator context.
# Context names the code that shows the message. Edit TOML, never generated Rust.

[messages.a11y_pane]
context = "crates/kettle-ui/src/app.rs accessibility_tree: screen-reader name of a pane whose program set no title. id is the pane's number."
args = [{ name = "id", type = "u64" }]

[messages.a11y_window]
context = "crates/kettle-ui/src/app.rs: screen-reader name of a Kettle window. Kettle is the product name."

[messages.about_copy_version]
