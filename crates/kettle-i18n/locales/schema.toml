[messages.media_lane_a11y_next_diagram]
context = "crates/kettle-ui/src/app.rs accessibility_tree: screen-reader name of a preview lane's button that shows the diagram after this one in a gallery: the Mermaid diagrams of one Markdown file, or several copied together. Unavailable on the last diagram."

[messages.media_lane_a11y_diagram]
context = "crates/kettle-ui/src/app.rs media_lane_accessibility: part of a preview lane's screen-reader name for a gallery of diagrams: which diagram it shows (index of count, counting from 1). Lowercase, as it sits between other parts separated by middle dots."
args = [{ name = "index", type = "u64" }, { name = "count", type = "u64" }]

[messages.media_lane_notice_image_copied]
context = "crates/kettle-ui/src/app.rs lane_notice_text: shown in a preview lane's footer after its image was copied to the clipboard."

[messages.media_lane_notice_source_copied]
context = "crates/kettle-ui/src/app.rs lane_notice_text: shown in a preview lane's footer after the item's source text was copied to the clipboard."

[messages.media_lane_notice_copy_failed]
context = "crates/kettle-ui/src/app.rs lane_notice_text: shown in a preview lane's footer when the clipboard refused a copy."

[messages.media_lane_notice_copy_busy]
context = "crates/kettle-ui/src/app.rs lane_notice_text: shown in a preview lane's footer when a copy is refused because another copy is still running and one more waits."

[messages.media_lane_notice_rendering]
context = "crates/kettle-ui/src/app.rs lane_notice_text: shown in a preview lane's footer while a diagram is rendered again for the background the user chose; the old picture stays until then."

[messages.media_lane_notice_render_failed]
context = "crates/kettle-ui/src/app.rs lane_notice_text: shown in a preview lane's footer when rendering the item again (for another background) failed; the old picture stays."

[messages.media_lane_notice_changed]
context = "crates/kettle-ui/src/app.rs lane_notice_text: shown in a preview lane's footer when the file the item came from changed since it was shown, so it was not rendered again from the new contents."

[messages.card_a11y]
context = "crates/kettle-ui/src/app.rs card_accessibility_node: screen-reader name of an inline media card drawn in a terminal pane, a button that opens the item in Kettle's media viewer. title is the item's title (as the agent or command named it); detail is its kind, pixel size and sender, as the viewer shows them, e.g. \"Image · 640×480 · From this pane\"."
args = [{ name = "title", type = "str" }, { name = "detail", type = "str" }]

[messages.card_a11y_open]
context = "crates/kettle-ui/src/app.rs card_accessibility_node: screen-reader description of an inline media card's button: what activating it does. 'Kettle' is the product name; 'media viewer' is Kettle's own viewer, not another app."

[messages.window_title_new_media]
context = "crates/kettle-ui/src/app.rs desired_window_title: prefix of the OS window title while the focused pane's media shelf holds items the user has not opened. ASCII only: Linux window-manager title fonts may lack symbols. count is how many."
args = [{ name = "count", type = "u64" }]
