# Review status of each Spanish message, by key. `draft`: model-drafted,
# not yet accepted. `accepted`: a fluent reviewer accepted it in context, on
# rendered UI. Confirmation prompts and screen-reader text (marked `second-pass`
# below) also need the second pass TRANSLATING.md describes before they count as
# accepted. `tests/catalogue.rs` keeps this file and `es.toml` key for key.
#
# The owner designated the implementation reviewer to verify this catalogue
# independently. Messages remain drafts until rendered context and required
# second-pass review are recorded; source review alone is not acceptance.
# 2026-10-11: every message was reviewed against its English and context on
# the rendered Spanish build, the confirmations and screen-reader names given
# the second pass, the changes confirmed, and all of it accepted.

# 2026-10-13: the four new viewer messages were reviewed in native Spanish
# Wayland UI; dialog and Pin names received a second pass through AT-SPI.
# 2026-10-14: the move-tab chooser and its empty state were reviewed
# in rendered Spanish UI; native keyboard and pointer selection passed.
# The drop-error notification was checked in the GNOME notification list,
# expanded and readable, after a rejected 33-file batch left input unchanged.
