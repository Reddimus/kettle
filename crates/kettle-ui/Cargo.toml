[package]
name = "kettle-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# See `kettle-config/Cargo.toml` for the cycle-218 per-crate-description rationale.
description = "kettle: winit app, tab/pane mux, Terminator-style splits, overlays (search/palette/themes), session save/restore"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
arboard = "3.6.1"
crossbeam-channel = "0.5.15"
kettle-config = { version = "1.2.0", path = "../kettle-config" }
kettle-core = { version = "1.2.0", path = "../kettle-core" }
kettle-render = { version = "1.2.0", path = "../kettle-render" }
log.workspace = true
notify = "8.2.0"
open = "5.3.5"
pollster = "0.4.0"
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0.149"
winit = "0.30.13"
