[package]
name = "kettle-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# See `kettle-config/Cargo.toml` for the cycle-218 per-crate-description rationale.
description = "kettle: winit app, tab/pane mux, Terminator-style splits, overlays (search/palette/themes), session save/restore"

[lints]
workspace = true

[features]
# Cycle 875: developer-only session recorder (asciicast-compatible trace of
# output / resize / keystroke tokens / UI markers). Compiled OUT of released
# and packaged builds — enable with `cargo build --features dev-record`. The
# `--record <path>` CLI flag only exists in feature-enabled builds.
# Cycle 924: the recorder lives in kettle-core now (`record.rs`); this feature
# turns on `kettle-core/asciicast` so it compiles in. `crate::dev_record`
# re-exports it, so call sites are unchanged.
dev-record = ["kettle-core/asciicast"]

[dependencies]
anyhow.workspace = true
# Cycle 277: default-features off drops the `image_data` feature,
# which transitively pulls `image` with default features (= every
# format incl. avif/rav1e). kettle's clipboard surface is text-
# only (selection copy / paste / OSC 52); no image-to-clipboard
# path exists. Saves another ~MB on the binary alongside the
# kettle-vt feature narrowing.
arboard = { version = "3.6.1", default-features = false }
crossbeam-channel = "0.5.15"
# Cycle 752: decode the embedded PNG app icon into a winit window icon so
# the title bar (system-menu glyph), taskbar button, and Alt-Tab show
# kettle's icon for the *running* window. Only the `png` feature — the icon
# assets are PNG. `image` is already built for the workspace (kettle-render
# pulls it), so this adds no new crate to the dependency graph. The build.rs
# winresource step embeds the same art as an .exe resource, which covers
# Explorer / the file glyph / a pinned shortcut but NOT the live window's
# WM_SETICON — hence this runtime path.
image = { version = "0.25.10", default-features = false, features = ["png"] }
kettle-config.workspace = true
kettle-core.workspace = true
kettle-render.workspace = true
# Cycle 655 (sub-cycle 6 of TERMINATOR-REMOTE-DESIGN.md): SSH /
# Docker / Podman / kubectl session detection. Carries the sysinfo
# dep into kettle-ui where the App's poll loop will live; non-UI
# consumers stay isolated.
kettle-remote.workspace = true
log.workspace = true
# Cycle 324: Lua scripting foundation. The `--lua-script PATH`
# CLI flag executes a Lua file at startup with a `kettle`
# namespace exposing the introspection surface. WezTerm parity.
# Future sub-cycles add send_text + event hooks.
mlua.workspace = true
notify = "8.2.0"
notify-rust.workspace = true
open = "5.3.5"
pollster = "0.4.0"
# Cycle 290: triggers (cycle 289 config) compile to `regex::Regex`
# in the App layer (not kettle-core) — the matching engine reads
# the focused-pane viewport via the existing Mux API, no reader-
# thread plumbing needed. Workspace-pinned via the cycle-264
# deny.toml license allow-list.
regex.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0.149"
# Cycle 794: in-app update checker (notify-only) — one unauthenticated HTTPS GET
# of the GitHub "latest release" endpoint on a background thread. `ureq` is a
# blocking, pure-Rust HTTP client that matches kettle's thread-based model (no
# tokio); `rustls` (pure-Rust TLS, no system OpenSSL) keeps the aarch64
# cross-build trivial. default-features off drops `gzip`/`json`/`cookies` we
# don't use; we parse with the serde_json already above.
ureq = { version = "2", default-features = false, features = ["tls"] }
winit = "0.30.13"

# Cycle 399: SCM_RIGHTS fd-passing for detachable-tabs Bucket-D
# sub-cycle 3. Unix-only (Linux + macOS + BSDs); Windows + Wayland
# get the Action::MoveTabToNewWindow keyboard-driven fallback.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Cycle 745: ITaskbarList3 for OSC 9;4 taskbar progress (PowerShell 7 /
# Windows Terminal parity — `Write-Progress` + `winget` drive the taskbar
# button). The `windows` crate gives safe COM wrappers; 0.62 is already in
# the workspace lockfile, and the feature set is narrow + Windows-only, so
# Linux/macOS builds are unaffected.
# Cycle 869: `Win32_UI_WindowsAndMessaging` adds FlashWindowEx/FLASHWINFO/
# FLASHW_STOP so `Taskbar::clear_attention` can reliably stop the Win11
# taskbar flash on focus-gain (winit's request_user_attention(None) doesn't).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Com",
    "Win32_Foundation",
] }

# Cycle 768: objc2 / objc2-app-kit for the macOS `sticky = true` window
# behavior (NSWindowCollectionBehavior::CanJoinAllSpaces) that winit 0.30 no
# longer exposes natively. Versions pinned to match winit 0.30's own
# objc2-app-kit (0.2 / objc2 0.5) so the ObjC class types are compatible and
# no extra major version enters the lockfile. macOS-only — other platforms
# never see these.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
# Class features must be opted into (objc2-app-kit ships none by default).
# NSView + NSWindow + their shared NSResponder superclass — the same trio winit
# 0.30 enables — give us `NSView::window()` and `NSWindow::setCollectionBehavior`.
objc2-app-kit = { version = "0.2", features = ["NSView", "NSWindow", "NSResponder"] }
