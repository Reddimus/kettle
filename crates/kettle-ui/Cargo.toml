[package]
name = "kettle-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# See `kettle-config/Cargo.toml` for the cycle-218 per-crate-description rationale.
description = "kettle: winit app, tab/pane mux, Terminator-style splits, overlays (search/palette/themes), session save/restore"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
# Cycle 277: default-features off drops the `image_data` feature,
# which transitively pulls `image` with default features (= every
# format incl. avif/rav1e). kettle's clipboard surface is text-
# only (selection copy / paste / OSC 52); no image-to-clipboard
# path exists. Saves another ~MB on the binary alongside the
# kettle-vt feature narrowing.
arboard = { version = "3.6.1", default-features = false }
crossbeam-channel = "0.5.15"
kettle-config = { version = "1.2.0", path = "../kettle-config" }
kettle-core = { version = "1.2.0", path = "../kettle-core" }
kettle-render = { version = "1.2.0", path = "../kettle-render" }
# Cycle 655 (sub-cycle 6 of TERMINATOR-REMOTE-DESIGN.md): SSH /
# Docker / Podman / kubectl session detection. Carries the sysinfo
# dep into kettle-ui where the App's poll loop will live; non-UI
# consumers stay isolated.
kettle-remote = { version = "1.2.0", path = "../kettle-remote" }
log.workspace = true
# Cycle 324: Lua scripting foundation. The `--lua-script PATH`
# CLI flag executes a Lua file at startup with a `kettle`
# namespace exposing the introspection surface. WezTerm parity.
# Future sub-cycles add send_text + event hooks.
mlua.workspace = true
notify = "8.2.0"
notify-rust.workspace = true
open = "5.3.5"
pollster = "0.4.0"
# Cycle 290: triggers (cycle 289 config) compile to `regex::Regex`
# in the App layer (not kettle-core) — the matching engine reads
# the focused-pane viewport via the existing Mux API, no reader-
# thread plumbing needed. Workspace-pinned via the cycle-264
# deny.toml license allow-list.
regex.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0.149"
winit = "0.30.13"

# Cycle 399: SCM_RIGHTS fd-passing for detachable-tabs Bucket-D
# sub-cycle 3. Unix-only (Linux + macOS + BSDs); Windows + Wayland
# get the Action::MoveTabToNewWindow keyboard-driven fallback.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
