[package]
name = "kettle-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# See `kettle-config/Cargo.toml` for the per-crate-description rationale.
description = "kettle: wgpu + glyphon GPU renderer — quads, images, text, overlay pass, headless offscreen self-test"

[lints]
workspace = true

[features]
# `Default` for `Overlay` and `SearchOverlay`, for tests only. A default overlay
# speaks English and carries no state, so production code must list every
# field; without this feature it cannot build one from a default at all.
test-defaults = []

[dependencies]
alacritty_terminal = "0.26.0"
anyhow.workspace = true
bytemuck = { version = "1", features = ["derive"] }
glyphon = "0.12.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"] }
kettle-config.workspace = true
kettle-i18n.workspace = true
kettle-core.workspace = true
kettle-state.workspace = true
log.workspace = true
pollster = "1.0.1"
raw-window-handle = "0.6.2"
unicode-bidi.workspace = true
unicode-segmentation.workspace = true
unicode-width.workspace = true
wgpu = "30.0.0"

[dev-dependencies]
# Layout checks run every text-sized surface against the pseudo-locale, which
# exists only in debug test builds.
kettle-i18n = { workspace = true, features = ["dev-pseudo"] }
# Temp PNG output for the menu-visual integration test
# (tests/menu_visual.rs). Standard crate for this; tiny dep, only
# pulled in for test compilation.
tempfile = "3"
kettle-test-support.workspace = true
# The snapshot zerowidth round-trip test builds a real
# `Term<EventProxy>`, whose `EventProxy::new` needs a crossbeam Sender.
# Same version kettle-core already pins; test-only.
crossbeam-channel = "0.5.15"
serde_json = "1"

[target.'cfg(target_os = "macos")'.dev-dependencies]
# The cursor patch test hands a standalone CAMetalLayer to the renderer.
# wgpu-hal already locks this version with exactly these features, so the
# lockfile gains no package; the default features would pull in CoreVideo.
objc2-quartz-core = { version = "0.3.2", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "CALayer",
    "CAMetalLayer",
    "objc2-metal",
] }
