[package]
name = "kettle-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# See `kettle-config/Cargo.toml` for the cycle-218 per-crate-description rationale.
description = "kettle: wgpu + glyphon GPU renderer — quads, images, text, overlay pass, headless offscreen self-test"

[lints]
workspace = true

[dependencies]
alacritty_terminal = "0.26.0"
anyhow.workspace = true
bytemuck = { version = "1", features = ["derive"] }
glyphon = "0.11.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
kettle-config = { version = "1.0.1", path = "../kettle-config" }
kettle-core = { version = "1.0.1", path = "../kettle-core" }
log.workspace = true
pollster = "0.4.0"
raw-window-handle = "0.6.2"
unicode-width.workspace = true
wgpu = "29.0.3"
