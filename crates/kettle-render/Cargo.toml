[package]
name = "kettle-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# See `kettle-config/Cargo.toml` for the per-crate-description rationale.
description = "kettle: wgpu + glyphon GPU renderer — quads, images, text, overlay pass, headless offscreen self-test"

[lints]
workspace = true

[features]
# `Default` for `Overlay` and `SearchOverlay`, for tests only. A default overlay
# speaks English and carries no state, so production code must list every
# field; without this feature it cannot build one from a default at all.
test-defaults = []

[dependencies]
alacritty_terminal = "0.26.0"
anyhow.workspace = true
bytemuck = { version = "1", features = ["derive"] }
glyphon = "0.12.0"
# Canonical combining classes and decompositions for fallback mark placement.
# `url` already builds this exact version into the binary through `idna`.
icu_normalizer = { version = "2.4.0", default-features = false, features = ["compiled_data"] }
image = { workspace = true, features = ["png", "jpeg", "webp", "bmp", "gif"] }
kettle-config.workspace = true
kettle-i18n.workspace = true
kettle-core.workspace = true
kettle-state.workspace = true
log.workspace = true
pollster = "1.0.1"
raw-window-handle = "0.6.2"
# GPOS mark anchors, to tell which marks the shaping font placed itself. The
# version harfrust and skrifa already resolve for cosmic-text.
read-fonts = { version = "0.37.0", default-features = false, features = ["std"] }
# Inspect the raster source so COLR and bitmap alpha keep their representation.
swash = { version = "0.2.10", default-features = false }
unicode-bidi.workspace = true
unicode-segmentation.workspace = true
unicode-width.workspace = true
wgpu = "30.0.0"

[dev-dependencies]
# Layout checks run every text-sized surface against the pseudo-locale, which
# exists only in debug test builds.
kettle-i18n = { workspace = true, features = ["dev-pseudo"] }
# Temp PNG output for the menu-visual integration test
# (tests/menu_visual.rs). Standard crate for this; tiny dep, only
# pulled in for test compilation.
tempfile = "3"
kettle-test-support.workspace = true
# The snapshot zerowidth round-trip test builds a real
# `Term<EventProxy>`, whose `EventProxy::new` needs a crossbeam Sender.
# Same version kettle-core already pins; test-only.
crossbeam-channel = "0.5.15"

# `cpu_present`: CPU frames presented with no GPU driver in the process.
# Every crate here except softbuffer is already in the graph through winit.
[target.'cfg(target_os = "linux")'.dependencies]
# Looks up libwayland-client's `wl_proxy_get_display` (1.23+), to check a
# window's surface is on the presenter's connection.
libc = "0.2.191"
# Maps each wl_shm buffer's memfd.
memmap2 = "0.9.12"
# memfd_create, ftruncate and seals for those buffers.
rustix = { version = "1.1.6", default-features = false, features = ["fs", "std"] }
# X11 presentation (MIT-SHM, falling back to PutImage) and the Wayland
# fallback. No KMS: Kettle always presents to a window.
softbuffer = { version = "0.4.8", default-features = false, features = [
    "wayland",
    "wayland-dlopen",
    "x11",
    "x11-dlopen",
] }
# The wl_shm presenter binds its own queue on winit's wl_display (`system`)
# and loads libwayland-client at run time, as winit does (`dlopen`).
wayland-client = { version = "0.31.15", features = ["system", "dlopen"] }
# Asks an X11 window's depth, to know whether its visual carries alpha.
x11rb = "0.13.2"

[target.'cfg(target_os = "linux")'.dev-dependencies]
# The live `cpu_present_live` example opens a real window. Same version and
# features as kettle-ui, so the lockfile gains nothing.
winit = { version = "0.30.13", default-features = false, features = [
    "rwh_06",
    "x11",
    "wayland",
    "wayland-dlopen",
    "wayland-csd-adwaita-notitle",
] }
# An in-process compositor for the wl_shm presenter's protocol tests. Its
# dependencies are all in the graph already through wayland-client.
wayland-server = "0.31.14"

[target.'cfg(target_os = "macos")'.dev-dependencies]
# The cursor patch test hands a standalone CAMetalLayer to the renderer.
# wgpu-hal already locks this version with exactly these features, so the
# lockfile gains no package; the default features would pull in CoreVideo.
objc2-quartz-core = { version = "0.3.2", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "CALayer",
    "CAMetalLayer",
    "objc2-metal",
] }
