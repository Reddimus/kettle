[package]
name = "kettle-ctl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# Agent-first (A2): the control-plane protocol + transport + client,
# isolated in a UI-free leaf crate. The GUI App hosts the server (kettle-ui),
# the bin hosts the `kettle ctl` client + `kettle mcp` bridge — but the wire
# protocol, the platform transport (Unix socket / Windows named pipe), the
# discovery registry, and the blocking client live HERE so the future
# `kettle-muxd` daemon (docs/MUX-SERVER-DESIGN.md) can re-host the same server
# side without breaking any client.
description = "kettle: agent control-plane protocol, local-IPC transport (Unix socket / Windows named pipe), discovery registry, and blocking client"

[lints]
workspace = true

[dependencies]
kettle-state.workspace = true
log.workspace = true
serde = { workspace = true }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
# Multi-window (Peacock presence): pid-liveness via kill(pid, 0) for
# stale-entry cleanup. Already in the workspace graph (kettle-ui).
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Hand-rolled named-pipe transport. Both accepted and client handles use
# FILE_FLAG_OVERLAPPED so request deadlines can cancel exact pending I/O via
# CancelIoEx without a synchronous server-side escape hatch.
# Chosen over `interprocess` to keep this security-sensitive subset explicit.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Pipes",
    # ConnectNamedPipe's signature references OVERLAPPED (Win32_System_IO).
    "Win32_System_IO",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_Security_Authorization",
    # Multi-window (Peacock presence): pid-liveness via OpenProcess +
    # GetExitCodeProcess for stale-entry cleanup.
    "Win32_System_Threading",
] }
