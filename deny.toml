# cargo-deny config. Catches supply-chain issues that `cargo audit`
# doesn't (license violations, git-based deps, banned crates) — the
# two tools complement each other.
#
# Local run, for the product and vendor-validation lock graphs (`just deny`
# runs both):
#
#   cargo install cargo-deny
#   cargo deny check licenses sources bans
#   cargo deny --manifest-path vendor/Cargo.toml check licenses sources bans
#
# CI runs the same on every Cargo.lock change via
# `.github/workflows/deny.yml`.

[graph]
# Match what release.yml + ci.yml build for.
targets = [
  { triple = "x86_64-unknown-linux-gnu" },
  # aarch64-linux is built by release.yml and checked by ci.yml, so the
  # supply-chain graph must cover it too.
  { triple = "aarch64-unknown-linux-gnu" },
  { triple = "x86_64-apple-darwin" },
  { triple = "aarch64-apple-darwin" },
  { triple = "x86_64-pc-windows-msvc" },
]
all-features = false
no-default-features = false

[output]
feature-depth = 1

# There is no `[advisories]` section: CI and `just deny` run only the license,
# source and ban checks. RustSec advisories are scanned by `cargo audit` in
# `.github/workflows/audit.yml` and `just audit`, which hold the reviewed
# advisory ignores. A bare `cargo deny check` also runs cargo-deny's own
# advisory check, which has none of those ignores.

[licenses]
# SPDX expressions every workspace dep is allowed to carry. The
# OSI-approved permissive set every Rust project uses, plus the
# small handful of "data file" licenses (Unicode tables, Mozilla
# CA bundle, etc.) crates.io needs:
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "CC0-1.0",
  "MPL-2.0",
  # `unicode-ident` etc. — DFS-style Unicode data tables.
  "Unicode-DFS-2016",
  "Unicode-3.0",
  # The Mozilla CA-certificate bundle (`webpki-roots`, the TLS trust anchors
  # for the in-app update checker's rustls HTTPS GET) ships under the
  # Community Data License Agreement — a permissive *data-file* license, exactly
  # the "Mozilla CA bundle" case the section comment above anticipates.
  "CDLA-Permissive-2.0",
  # Public-domain-equivalent free text.
  "0BSD",
  "Unlicense",
  # The OFL is for fonts — kettle bundles JetBrains Mono Nerd Font
  # (`assets/fonts/`, embedded via include_bytes in
  # `kettle-config/src/font.rs`).
  "OFL-1.1",
  # Boost Software License (`clipboard-win` and `error-code`, via arboard).
  "BSL-1.0",
]
# `confidence-threshold` rules out a fuzzy SPDX match; we want exact.
confidence-threshold = 0.93

[bans]
# Warn on duplicate versions of the same crate so a future
# Cargo.lock that pulls in *three* hashbrowns is noticed — but
# don't fail CI, because the current dep tree carries a handful of
# upstream-bound splits (cfg_aliases v0.1 / v0.2 via portable-pty
# vs wgpu; foldhash + hashbrown minor splits; etc.). Those would
# need an upstream coordination to unify.
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
# Crates that must not come back. List an entry when a crate becomes
# unmaintained, vulnerable or replaced.
deny = [
  # RUSTSEC-2026-0192: unmaintained. fontdb 0.24 dropped it (the vendored
  # cosmic-text backports that bump), and winit's sctk-adwaita titlebar is
  # built without a text renderer, so nothing needs it (#36).
  { crate = "ttf-parser", reason = "unmaintained (RUSTSEC-2026-0192)" },
]

[sources]
# crates.io only. Git deps and unknown registries are refused.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
