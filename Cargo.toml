[workspace]
resolver = "2"
members = [
    "crates/kettle-config",
    "crates/kettle-core",
    "crates/kettle-vt",
    "crates/kettle-render",
    "crates/kettle-ui",
    "crates/kettle",
]

[workspace.package]
version = "1.3.0"
# Cycle 213: edition was "2021" but every crate's Cargo.toml declared
# "2024" individually. Bumped here to match reality and let crates
# inherit via `edition.workspace = true`.
edition = "2024"
# Cycle 225: MSRV declaration. The workspace uses let-chains
# (`if X && let Y = ... && Z`) in several places — kettle-vt,
# kettle-config, kettle-render, kettle (binary). Let-chains
# stabilized in Rust 1.88. Without `rust-version` set, a user on
# 1.85-1.87 (which support edition 2024 but predate let-chain
# stabilization) hits cryptic `expected expression, found
# keyword 'let'` syntax errors instead of cargo's clean "package
# requires rustc 1.88" message at the resolver level. This is a
# floor, not a ceiling; we still develop and CI on stable.
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/Reddimus/kettle"
authors = ["kettle contributors"]
description = "A fast, cross-platform GPU terminal emulator combining the best of Ghostty, Terminator, kitty, Alacritty and WezTerm"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
regex = "1"
unicode-width = "0.2"

[workspace.lints.clippy]
# Cycle 220: forward-guard against three patterns we never want
# committed to main. `clippy -- -D warnings` already denies the
# default clippy levels; this block opts each lint up to deny so
# it survives a future `--warnings=allow` invocation and is
# visible policy in the manifest rather than a CI flag.
#
# - `dbg_macro` — `dbg!(x)` is fine while debugging but leaks
#   debug prints into release builds + tests if forgotten.
# - `todo` / `unimplemented` — `todo!()` and `unimplemented!()`
#   panic at runtime; they belong in scratchpads, not in committed
#   main. A real not-yet-implemented surface should return a
#   typed error so callers can decide.
#
# The codebase has zero occurrences of all three today, so this
# is purely "lock the door before someone walks through it." If a
# legitimate case ever arises (`todo!()` inside a freshly stubbed-
# out branch during an in-progress feature), the contributor adds
# `#[allow(clippy::todo)]` with a one-line justification, the same
# pattern used everywhere else.
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1
